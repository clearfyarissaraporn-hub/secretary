/* ---------- ไฟล์ปฏิทิน .ics (เวอร์ชัน GitHub): นำเข้าปฏิทินมือถือแล้วเด้งเตือนจริง ---------- */
async function exportIcs(){
  const list = S.appts.filter(a => !a.done && a.date >= today());
  if (!list.length){ toast('ยังไม่มีนัดที่จะถึง', true); return; }
  const esc2 = t => String(t || '').replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//secretary-app//TH','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  list.forEach(a => {
    const st = a.time || '09:00'; const sm = toMin(st); const em = sm + 60;
    const d0 = a.date.replace(/-/g, ''); const d1 = (em >= 1440 ? addDays(a.date, 1) : a.date).replace(/-/g, '');
    L.push('BEGIN:VEVENT', 'UID:' + a.id + '@secretary-app', 'DTSTAMP:' + stamp, 'DTSTART:' + d0 + 'T' + st.replace(':', '') + '00', 'DTEND:' + d1 + 'T' + fromMin(em).replace(':', '') + '00', 'SUMMARY:' + esc2(a.title));
    if (a.place || a.who) L.push('LOCATION:' + esc2(a.place || a.who));
    const r = a.remind || {}; const mins = [];
    if (r.d1) mins.push(1440); if (r.morning) mins.push(Math.max(0, sm - 420)); if (r.h2 && a.time) mins.push(120);
    [...new Set(mins)].forEach(m => L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc2(a.title), 'TRIGGER:-PT' + m + 'M', 'END:VALARM'));
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  const dl = await getDL();
  try{ await dl.save({filename:'secretary-reminders.ics', data:L.join('\r\n'), mimeType:'text/calendar'}); log('ดาวน์โหลดไฟล์ปฏิทิน ' + list.length + ' นัด', true); writeLocal(); toast('ดาวน์โหลดแล้ว เปิดไฟล์เพื่อเพิ่มลงปฏิทินมือถือ'); }
  catch(e){ toast('ดาวน์โหลดไม่สำเร็จ', true); }
}


/* ---------- แจ้งเตือนของแอป (เวอร์ชัน GitHub ที่ติดตั้งแล้ว): เด้งเมื่อเปิดแอปและระหว่างเปิดอยู่ ---------- */
const Noti = {
  ok(){ return STANDALONE && 'Notification' in window && Notification.permission === 'granted'; },
  async enable(){
    if (!('Notification' in window)){ toast('เครื่องนี้ไม่รองรับการแจ้งเตือนจากเว็บ', true); return; }
    const r = await Notification.requestPermission();
    S.settings.noti = r === 'granted'; commit(r === 'granted' ? 'เปิดแจ้งเตือนของแอป' : 'ไม่อนุญาตแจ้งเตือน', {msg: r === 'granted' ? 'เปิดแจ้งเตือนแล้ว' : 'ยังไม่ได้อนุญาต เปิดได้ที่การตั้งค่าเว็บไซต์ของ Chrome', silent:false});
    if (r === 'granted') this.check(true);
  },
  async check(test){
    if (!this.ok() || !S.settings.noti) return;
    let sent = {}; try{ sent = JSON.parse(localStorage.getItem('tmm-noti-v1') || '{}'); }catch(e){}
    const t = today(); if (sent.d !== t) sent = {d:t, ids:[]};
    const reg = navigator.serviceWorker ? await navigator.serviceWorker.getRegistration().catch(() => null) : null;
    const show = (title, body, tag) => { try{ if (reg) reg.showNotification(title, {body, tag, icon:'icon-192.png', badge:'icon-192.png'}); else new Notification(title, {body, tag, icon:'icon-192.png'}); }catch(e){} };
    if (test) show('เลขาส่วนตัว', 'แจ้งเตือนพร้อมใช้งานแล้ว', 'test');
    const nowT = Date.now(); notiPlan(2).filter(x => x.at <= nowT && x.at > nowT - 6 * 3600e3).forEach(x => { if (sent.ids.includes(x.key)) return; show(x.title, x.body || '', x.key); sent.ids.push(x.key); });

/* ---------- แจ้งเตือนจริงแม้ปิดแอป (Web Push ผ่านเซิร์ฟเวอร์ Cloudflare ของคุณเอง) ---------- */

  b64ToBytes(s){ const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, ch => ch.charCodeAt(0)); },
  async connect(url, key){

    if (!this.supported()){ toast('ต้องเปิดจากแอปที่ติดตั้งจาก GitHub ใน Chrome', true); return; }

      if (!v.publicKey) throw new Error(v.error || 'เซิร์ฟเวอร์ยังไม่พร้อม');

      c.key = String(key || '').trim() || c.key || Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
      this.save(c); await this.writeCfg(c);

      if (ok){ toast('เชื่อมต่อแล้ว กด “ทดสอบเด้ง” ได้เลย'); log('เชื่อมแจ้งเตือนจริง (Push)', true); writeLocal(); }
    }catch(e){ this.status = 'เชื่อมไม่สำเร็จ: ' + (e.message || e); toast(this.status, true); }

  async sync(subIn){

function anesToTypes(codes){
  const C = codes.map(c => String(c || '').replace(/\s+/g, '').trim()).filter(Boolean);
  if (!C.length) return null;
  const has = re => C.some(c => re.test(c));
  if (has(/^(VAC|BDL|AL|ลา)/i)) return ['VAC'];
  const ch = has(/^ช/), maha = has(/^[บด].*(AN|RR)$/i), stb = has(/(SA|SR)$/i);
  if (maha) return ['8-00'];
  if (ch && stb) return ['8-16','STD'];
  if (ch) return ['8-16'];
  if (stb) return ['STD'];
  if (has(/^(OFF|X)/i)) return ['OFF'];
  return null;
}

function extractJsonObjects(text){
  const out = []; let i = 0;
  while ((i = text.indexOf('{', i)) >= 0){
    let depth = 0, inStr = false, esc2 = false, k = i;
    for (; k < text.length; k++){
      const ch = text[k];
      if (inStr){ if (esc2) esc2 = false; else if (ch === '\\') esc2 = true; else if (ch === '"') inStr = false; continue; }
      if (ch === '"') inStr = true; else if (ch === '{') depth++; else if (ch === '}'){ depth--; if (depth === 0) break; }
    }
    if (depth !== 0) break;
    try{ const o = JSON.parse(text.slice(i, k + 1)); if (o && (Array.isArray(o.rows) || o.days || o.id || Array.isArray(o.holidays))) out.push(o); }catch(e){}
    i = k + 1;
  }
  return out;
}
function peopleFromJson(v, ymSel){

function peopleFromAnesRows(rows, ym, titleText){
  const hi = rows.findIndex(cells => cells.filter(c => /^\d{1,2}$/.test(c.text) && +c.text >= 1 && +c.text <= 31).length >= 25);
  if (hi < 0) return [];
  const colDay = {}; rows[hi].forEach((c, ci) => { if (/^\d{1,2}$/.test(c.text)) colDay[ci] = +c.text; });
  const shiftRe = /^[ชบด]\s*\(/;
  if (!rows.some(cells => cells.some(c => shiftRe.test(c.text)))) return [];
  const dept = /วิสัญญี|anes/i.test(titleText || '') ? 'วิสัญญี' : '';
  const [y,m] = ym.split('-').map(Number); const nd = new Date(y, m, 0).getDate();
  const owners = new Map();
  rows.forEach((cells, ri) => {
    if (ri <= hi || !cells.some(c => shiftRe.test(c.text))) return;
    let owner = null;
    for (let k = ri; k >= Math.max(hi + 1, ri - 2) && !owner; k--){
      const idc = rows[k].findIndex(c => /^\d{5,7}$/.test(c.text));
      if (idc >= 0){
        const nameCell = rows[k].slice(idc + 1).find(c => c.text && !shiftRe.test(c.text) && !/^\d+$/.test(c.text));
        const nm = nameCell ? nameCell.raw || nameCell.text : '';
        const lines = String(nm).split(/\n+/).map(t => t.trim()).filter(Boolean);
        owner = {empId: rows[k][idc].text, name: (lines[0] || '').replace(/\s+/g, ' '), pos: lines.slice(1).join(' ')};
      }
    }
    if (!owner) return;
    const o = owners.get(owner.empId) || Object.assign(owner, {dept, codes:{}});
    Object.keys(colDay).forEach(ci => { const t = (cells[ci] || {}).text || ''; const d = colDay[ci]; if (t && d <= nd){ (o.codes[d] = o.codes[d] || []).push(t); } });
    owners.set(owner.empId, o);
  });
  return [...owners.values()].map(o => ({empId:o.empId, name:o.name, pos:o.pos, dept:o.dept,
    list: Object.keys(o.codes).map(Number).sort((a, b) => a - b).map(d => ({date:`${ym}-${pad(d)}`, types: anesToTypes(o.codes[d]), raw: o.codes[d].join(' ')})).filter(x => x.types)})).filter(p => p.list.length);
}

    ym = ym || findYm(allText) || ymSel;
    const [yy,mm] = ym.split('-').map(Number); const nd = new Date(yy, mm, 0).getDate();
    /* หัวตาราง: แถวที่มีตัวเลข 1..31 มากที่สุด */
    const nums = items.filter(i => /^\d{1,2}$/.test(i.t) && +i.t >= 1 && +i.t <= 31);
    const groups = [];
    nums.forEach(i => { const g = groups.find(g => Math.abs(g.y - i.y) < 6); if (g) g.list.push(i); else groups.push({y:i.y, list:[i]}); });
    const head = groups.map(g => ({y:g.y, map:new Map(g.list.map(i => [+i.t, i.x + i.w / 2]))})).sort((a, b) => b.map.size - a.map.size)[0];
    if (!head || head.map.size < Math.min(25, nd - 3)) continue;
    const xs = [...head.map.keys()].sort((a, b) => a - b);
    const colW = (head.map.get(xs[xs.length - 1]) - head.map.get(xs[0])) / Math.max(1, xs[xs.length - 1] - xs[0]);
    const dayX = d => head.map.has(d) ? head.map.get(d) : head.map.get(xs[0]) + (d - xs[0]) * colW;
    const firstX = dayX(1) - colW / 2;
    const dayList = [...head.map.entries()].sort((a, b) => a[0] - b[0]);
    const nearestDay = x => { let best = null, bd = 1e9; dayList.forEach(([d, hx]) => { const dd = Math.abs(hx - x); if (dd < bd){ bd = dd; best = d; } }); return bd < colW * 0.75 ? best : null; };
    const ids = items.filter(i => /^\d{5,7}$/.test(i.t) && i.y > head.y + 4).sort((a, b) => a.y - b.y);
    const gaps = ids.slice(1).map((i, k) => i.y - ids[k].y).filter(v => v > 4);
    const rowH = gaps.length ? Math.min(...gaps) : 40;
    const rowOf = it => { let best = null, bd = 1e9; ids.forEach(id => { const dd = Math.abs(id.y - it.y); if (dd < bd){ bd = dd; best = id; } }); return bd < Math.max(rowH * 0.8, 16) ? best : null; };
    const PUA = {'\uf705':'่','\uf706':'้','\uf707':'๊','\uf708':'๋','\uf709':'์','\uf70a':'่','\uf70b':'้','\uf70c':'๊','\uf70d':'๋','\uf70e':'์','\uf710':'ั','\uf711':'ิ','\uf712':'ี','\uf713':'ึ','\uf714':'ื','\uf715':'ํ','\uf716':'็'};
    const fixTh = t => t.replace(/[\uf700-\uf8ff]/g, ch => PUA[ch] || '');
    ids.forEach(idI => {
      const row = items.filter(i => i !== idI && rowOf(i) === idI);
      const nameParts = row.filter(i => i.x + i.w <= firstX + 2 && i.x >= idI.x + idI.w - 2 && !/^\d+$/.test(i.t)).sort((a, b) => a.x - b.x);
      let name = ''; nameParts.forEach((it, k) => { const prev = nameParts[k - 1]; name += (prev && it.x - (prev.x + prev.w) > 3 ? ' ' : '') + fixTh(it.t); });
      name = name.replace(/\s+/g, ' ').trim();
      /* ข้อความในแถวอาจติดกันหลายช่อง เช่น "8-00STD8-16" → แยกเป็นทีละรหัส แล้ววางตามตำแหน่ง */
      const byDay = {};
      row.filter(i => i.x + i.w > firstX).forEach(it => {
        const raw = it.t; const re = /8-16|8-00|8-8|STD|OFF|X/gi; let m, prev = 0;
        while ((m = re.exec(raw))){
          const mid = it.x + it.w * ((m.index + m[0].length / 2) / raw.length);
          let d = nearestDay(mid); if (!d) continue;
          if (prev && d <= prev) d = prev + 1;   /* รหัสที่ติดกันในข้อความเดียว = คนละวันเรียงกัน */
          prev = d;
          if (!byDay[d]) byDay[d] = {code: m[0].toUpperCase(), y: it.y};
        }
      });
      const list = [];
      Object.keys(byDay).map(Number).sort((a, b) => a - b).forEach(d => {
        if (d > nd) return;
        const cx = dayX(d); const lw = d > 1 && head.map.has(d - 1) ? Math.min(colW * 2, cx - dayX(d - 1)) : colW; const sx = Math.round(cx - lw * 0.42), sy = Math.round(byDay[d].y);
        /* อ่านสีพื้นช่องจากหลายจุด (ข้อความอาจทับจุดเดียว) แล้วเลือกสีที่เจอมากที่สุด */
        const pts = [[cx, sy - rowH * 0.3], [cx, sy + rowH * 0.3], [sx, sy], [cx + lw * 0.42, sy], [sx, sy - rowH * 0.25], [cx + lw * 0.42, sy + rowH * 0.25]];
        const cnt = {};
        pts.forEach(([px0, py0]) => { const x0 = Math.round(px0), y0 = Math.round(py0); if (x0 < 0 || y0 < 0 || x0 >= cv.width || y0 >= cv.height) return; const px = ctx.getImageData(x0, y0, 1, 1).data; const k = colorKind('#' + [px[0], px[1], px[2]].map(n => n.toString(16).padStart(2, '0')).join('')); cnt[k] = (cnt[k] || 0) + 1; });
        const best = ['yellow','blue','red'].filter(k => cnt[k]).sort((p1, p2) => cnt[p2] - cnt[p1])[0] || (cnt.white ? 'white' : '');
        const color = {yellow:'#ffff00', blue:'#2e75b6', red:'#ff0000', white:'#ffffff'}[best] || '';
        const ts = codeToTypes(byDay[d].code, color);
        if (ts) list.push({date:`${ym}-${pad(d)}`, types:ts});
      });
      if (list.length) people.push({empId:idI.t, name, list});
    });
    if (people.length) break;
  }
  return {ym: ym || ymSel, people, canvas:firstCanvas};
}

function applyTeamPending(){

  const dept = (document.getElementById('tf-dept') || {}).value || P.dept || '';
  const replace = !!(document.getElementById('tf-replace') || {}).checked;
  const T = team(); const me = meMember(); let added = 0, mineDays = 0, cells = 0; const ym = P.ym;
  const badName = n => !n || /^[ชบด]\s*\(/.test(n);
  picked.forEach(p => {
    const isMe = (S.settings.profile.id && p.empId === S.settings.profile.id) || (me.empId && p.empId === me.empId);
    if (isMe){ if (P.mine){ p.list.forEach(x => { S.shifts[x.date] = {types:x.types}; mineDays++; }); } return; }
    let mm = T.members.find(x => !x.me && ((p.empId && x.empId === p.empId) || (!p.empId && x.name === p.name)));
    if (!mm){ mm = {id:'t' + uid(), empId:p.empId, name:p.name, phone:'', dept, pos:p.pos || ''}; T.members.push(mm); added++; }
    else { if (badName(mm.name) && p.name) mm.name = p.name; if (!mm.dept && dept) mm.dept = dept; if (!mm.pos && p.pos) mm.pos = p.pos; }
    T.months[ym] = T.months[ym] || {};
    if (replace || !T.months[ym][mm.id]){ T.months[ym][mm.id] = {}; if (T.raw[ym]) delete T.raw[ym][mm.id]; }
    p.list.forEach(x => { T.months[ym][mm.id][x.date.slice(8)] = x.types; setTeamRaw(mm.id, x.date, x.raw || ''); cells++; });
  });
  const keepSw = !document.getElementById('tf-keepswap') || document.getElementById('tf-keepswap').checked;
  const kept = keepSw ? reassertSwaps([ym]) : 0;
  teamMonth = ym; teamPending = null; closeSheet();
  commit('นำเข้าตารางเวรทีม ' + ym + ' (' + picked.length + ' คน' + (dept ? ' · ' + dept : '') + ')', {msg:`นำเข้าแล้ว ${picked.length} คน${added ? ' (เพิ่มใหม่ ' + added + ')' : ''} · ${cells} ช่อง${replace ? '' : ' รวมกับของเดิม'}${P.mine ? ' · อัปเดตเวรของคุณ ' + mineDays + ' วัน' : ''}${kept ? ' · คงการแลกเวรไว้ ' + kept + ' ช่อง' : ''}`});
}

function csvParse(text){
  const rows = []; let row = [], cur = '', q = false;
  for (let i = 0; i < text.length; i++){
    const ch = text[i];
    if (q){ if (ch === '"'){ if (text[i + 1] === '"'){ cur += '"'; i++; } else q = false; } else cur += ch; continue; }
    if (ch === '"') q = true; else if (ch === ','){ row.push(cur); cur = ''; } else if (ch === '\n' || ch === '\r'){ if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cur); rows.push(row); row = []; cur = ''; } else cur += ch;
  }
  if (cur || row.length){ row.push(cur); rows.push(row); }
  return rows.map(r => r.map(c => c.trim()));
}
function parseDateAny(v){
  if (v == null || v === '') return null;
  if (typeof v === 'number' && v > 20000 && v < 80000){ const d = new Date(Math.round((v - 25569) * 86400e3)); return d.toISOString().slice(0,10); }
  const t = String(v).trim();
  let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (m){ let y = +m[3]; if (y < 100) y = y >= 60 ? 2500 + y : 2000 + y; if (y > 2400) y -= 543; return `${y}-${pad(+m[2])}-${pad(+m[1])}`; }
  return null;
}
function parseTimeAny(v){
  if (v == null || v === '') return '';
  if (typeof v === 'number'){ const f = v % 1; const mins = Math.round(f * 1440) % 1440; return `${pad(Math.floor(mins / 60))}:${pad(mins % 60)}`; }
  const m = String(v).match(/(\d{1,2})[:.](\d{2})/); return m ? `${pad(+m[1] % 24)}:${m[2]}` : '';
}
async function readCaseFile(file){
  if (/\.csv$/i.test(file.name) || /csv|text\/plain/.test(file.type)) return csvParse(await file.text());
  await loadScript(XLSX_URL);
  const wb = window.XLSX.read(await file.arrayBuffer(), {type:'array'});
  let best = null;
  wb.SheetNames.forEach(n => { const rows = window.XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:''}); if (!best || rows.length > best.length) best = rows; });
  return best || [];
}
function guessHeader(rows){
  let hi = 0, bestScore = -1;
  rows.slice(0, 20).forEach((r, i) => { const score = r.filter(c => typeof c === 'string' && c.trim() && CASE_FIELDS.some(f => f[2].test(c))).length; if (score > bestScore){ bestScore = score; hi = i; } });
  return hi;
}

/* ---------- ไฟล์ “ลงทะเบียนเคสผ่าตัด” ของ OR (1 แผ่น = 1 เดือน, มีคอลัมน์ Scrub/Circulate/Theatre start) ---------- */
const TH_MON_ABBR = [['มีค',3],['มิย',6],['เมย',4],['มค',1],['กพ',2],['พค',5],['กค',7],['สค',8],['กย',9],['ตค',10],['พย',11],['ธค',12]];
function sheetYm(name){
  const t = String(name || '').replace(/[\s.]/g, '');
  const mm = TH_MON_ABBR.find(([a]) => t.includes(a)); const yd = (t.match(/(\d{2,4})/) || [])[1];
  if (!mm || !yd) return null;
  let y = +yd; if (y < 100) y = y >= 60 ? 2500 + y - 543 : 2000 + y; else if (y > 2400) y -= 543;
  return `${y}-${pad(mm[1])}`;
}
function regDate(v, ym){
  const [Y, M] = ym.split('-').map(Number); const nd = new Date(Y, M, 0).getDate();
  let d = null;
  if (typeof v === 'number' && v > 20000){ const x = new Date(Math.round((v - 25569) * 86400e3)); const mo = x.getUTCMonth() + 1, da = x.getUTCDate(); d = mo === M ? da : da === M ? mo : null; }
  else if (v){ const t = String(v).trim(); const m = t.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-]/); if (m && +m[2] === M) d = +m[1]; else { const m2 = t.match(/^(\d{1,2})[\/.\-]/); if (m2) d = +m2[1]; } }
  return d && d >= 1 && d <= nd ? `${ym}-${pad(d)}` : null;
}
const normH = h => String(h || '').replace(/[\s\u00a0]+/g, ' ').trim().toLowerCase();
function isOrRegister(rows){ const h = (rows[0] || []).map(normH); return h.includes('theatre start') && h.some(x => x.startsWith('scrub')) && h.some(x => x.startsWith('circulate')); }
function regParse(sheet, who, withHn){
  const ym = sheetYm(sheet.name); if (!ym) return {ym:null, list:[]};
  const h = (sheet.rows[0] || []).map(normH);
  const col = n => h.indexOf(n); const cols = pre => h.map((x, i) => x.startsWith(pre) ? i : -1).filter(i => i >= 0);
  const iDate = col('วันที่'), iOp = col('operation'), iType = col('type'), iRoom = col('room'), iAn = col('under anes'), iSt = col('theatre start'), iEn = col('theatre finish'), iHn = col('hn');
  const iSc = cols('scrub'), iCi = cols('circulate'), iDr = cols('dr.');
  const keys = [who, who.slice(0, 5)].filter(k => k && k.length >= 3);
  const list = [];
  sheet.rows.slice(1).forEach(r => {
    const has = idxs => idxs.some(i => keys.some(k => String(r[i] || '').includes(k)));
    const asScrub = has(iSc), asCirc = has(iCi);
    if (!asScrub && !asCirc) return;
    const date = regDate(r[iDate], ym); const start = parseTimeAny(r[iSt]);
    if (!date || !start) return;
    const ty = String(r[iType] || '').toLowerCase(); const an = String(r[iAn] || '').toUpperCase();
    const surgeon = iDr.map(i => String(r[i] || '').trim()).filter(x => x && !/^n\/?a$/i.test(x))[0] || '';
    list.push({date, start, end: parseTimeAny(r[iEn]), cls: /major/.test(ty) ? 'major' : /minor/.test(ty) ? 'minor' : '',
      op: String(r[iOp] || '').trim(), surgeon, room: String(r[iRoom] || '').trim().toUpperCase(),
      anes: /GA|TIVA/.test(an) ? 'GA' : /LA|SB|RB|SA|BLOCK/.test(an) ? 'LA' : an ? 'อื่น ๆ' : '', anesRaw: an,
      role: asScrub ? 'Scrub' : 'Circulate', hn: withHn && iHn >= 0 ? String(r[iHn] || '').trim() : ''});
  });
  /* หลายหัตถการในห้องเดียวกันช่วงเวลาเดียวกัน = 1 เคส */
  const merged = [];
  list.forEach(c => { const m = merged.find(x => x.date === c.date && x.start === c.start && x.end === c.end && x.room === c.room);
    if (!m){ merged.push(c); return; }
    if (c.op && !m.op.includes(c.op)) m.op = m.op + ' + ' + c.op;
    if (c.cls === 'major') m.cls = 'major'; if (c.role === 'Scrub') m.role = 'Scrub'; });
  return {ym, list: merged};
}
async function readCaseBook(file){
  if (/\.csv$/i.test(file.name) || /csv|text\/plain/.test(file.type)) return [{name: file.name, rows: csvParse(await file.text())}];
  await loadScript(XLSX_URL);
  const wb = window.XLSX.read(await file.arrayBuffer(), {type:'array'});
  return wb.SheetNames.map(n => ({name: n, rows: window.XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, raw:true, defval:''}).filter(r => r.some(c => c !== '' && c != null)).slice(0, 2000)}));
}

function caseRowsFromMap(fd){
  const R = caseImp; const hi = Number(fd.get('hi')); const head = (R.rows[hi] || []).map(c => String(c || '').trim());
  const map = {}; CASE_FIELDS.forEach(f => { map[f[0]] = fd.get('m_' + f[0]) || ''; });
  const idx = k => map[k] ? head.indexOf(map[k]) : -1;
  const who = String(fd.get('who') || '').trim();
  const out = [];
  R.rows.slice(hi + 1).forEach(r => {
    const g = k => idx(k) >= 0 ? r[idx(k)] : '';
    const date = parseDateAny(g('date')); const start = parseTimeAny(g('start'));
    if (!date || !start) return;
    if (who && map.who && !String(g('who')).includes(who)) return;
    const end = parseTimeAny(g('end'));
    const ty = String(g('type')).toLowerCase(); const cls = /major|ใหญ่/.test(ty) ? 'major' : /minor|เล็ก/.test(ty) ? 'minor' : '';
    const an = String(g('anes')).toUpperCase(); const ro = String(g('role')).toLowerCase();
    const c = {date, start, end, cls, op: String(g('op') || '').trim(), surgeon: String(g('surgeon') || '').trim(), hn: String(g('hn') || '').trim(),
      anes: /GA/.test(an) ? 'GA' : /LA|SA|BLOCK/.test(an) ? 'LA' : an ? 'อื่น ๆ' : '', role: /scrub/.test(ro) ? 'Scrub' : /circ/.test(ro) ? 'Circulate' : /incharge/.test(ro) ? 'Incharge' : ''};
    c.ot = !!otAuto(date, start);
    const R2 = S.settings.otRule; c.night = c.ot && R2.nightOn !== false && (start >= R2.nightFrom || start < R2.nightTo);
    const key = c.date + '|' + c.start + '|' + c.op.toLowerCase();
    c.dup = (S.cases[c.date] || []).some(x => (x.date || c.date) && x.start === c.start && String(x.op || '').toLowerCase() === c.op.toLowerCase()) || out.some(x => x.key === key);
    c.key = key; out.push(c);
  });
  return {list: out, map, who};
}

function parseThaiDate(t, defYear){
  t = String(t || '').trim();
  let m = t.match(/(\d{4})-(\d{1,2})-(\d{1,2})/); if (m){ let y = +m[1]; if (y > 2400) y -= 543; return `${y}-${pad(+m[2])}-${pad(+m[3])}`; }

  const flat = t.replace(/\s+/g, ' ');
  for (let i = 0; i < 12; i++){
    const names = [TH_MON_FULL[i], TH_MON_SHORT[i], TH_MON_SHORT[i].replace(/\./g, '')];
    for (const nm of names){
      const re = new RegExp('(\\d{1,2})\\s*' + nm.replace(/\./g, '\\.') + '\\s*(\\d{2,4})?');
      const mm = flat.match(re);
      if (mm){ let y = mm[2] ? +mm[2] : defYear; if (y < 100) y = y >= 60 ? 2500 + y : 2000 + y; if (y > 2400) y -= 543; return `${y}-${pad(i + 1)}-${pad(+mm[1])}`; }
    }
  }
  return null;
}

async function tdPdf(d){
  const dl = await getDL(); toast('กำลังสร้าง PDF…');

  catch(e){ toast('โหลดตัวสร้าง PDF ไม่สำเร็จ (ต้องต่อเน็ตครั้งแรก)', true); return; }
  const box = document.createElement('div'); box.className = 'tdp-cap'; box.innerHTML = tdPrintHtml(d); document.body.appendChild(box);
  try{ if (document.fonts && document.fonts.ready) await document.fonts.ready;
    const cv = await window.html2canvas(box.firstElementChild, {scale:2, backgroundColor:'#ffffff', logging:false});
    const pdf = new window.jspdf.jsPDF({orientation:'p', unit:'mm', format:'a4'}); const w = 190, h = Math.min(277, cv.height * w / cv.width);
    pdf.addImage(cv.toDataURL('image/jpeg', 0.92), 'JPEG', 10, 10, w, h);
    const buf = pdf.output('arraybuffer'); const fname = 'team-' + d + '.pdf';
    if (!NATIVE && navigator.canShare){ const file = new File([buf], fname, {type:'application/pdf'}); if (navigator.canShare({files:[file]})){ try{ await navigator.share({files:[file], title:'ทีมและส่งเวร ' + d}); return; }catch(e){ if (e && e.name === 'AbortError') return; } } }
    await dl.save({filename: fname, data: buf, mimeType:'application/pdf'}); toast('ส่งไฟล์ PDF แล้ว');
  }catch(e){ if (!(e && e.code === 'declined')) toast('สร้าง PDF ไม่สำเร็จ', true); }
  finally{ box.remove(); }
}

/* เปิดแอป LINE ตรง ๆ ทุกครั้ง (ลิงก์ line.me แบบเดิมเปิดซ้ำครั้งที่ 2 ไม่ขึ้นในบางเครื่อง) */
function lineShare(text){
  const enc = encodeURIComponent(text); const ua = navigator.userAgent || '';
  const web = 'https://line.me/R/share?text=' + enc + '&_=' + Date.now();
  let url;
  if (NATIVE) url = 'line://msg/text/' + enc;
  else if (/Android/i.test(ua)) url = 'intent://msg/text/' + enc + '#Intent;scheme=line;package=jp.naver.line.android;S.browser_fallback_url=' + encodeURIComponent(web) + ';end';
  else if (/iPhone|iPad|iPod/i.test(ua)) url = 'line://msg/text/' + enc;
  else { window.open(web, '_blank', 'noopener'); log('ส่งทีมเข้า LINE', true); writeLocal(); return; }
  const t0 = Date.now(); location.href = url;
  setTimeout(() => { if (!document.hidden && Date.now() - t0 < 2500){ if (navigator.clipboard) navigator.clipboard.writeText(text).catch(() => {}); toast('ถ้า LINE ไม่เปิด: คัดลอกข้อความให้แล้ว เปิด LINE แล้ววางในกลุ่มได้เลย'); } }, 1800);
  log('ส่งทีมเข้า LINE', true); writeLocal();
}

    toast('แอปรุ่นนี้ยังพิมพ์ตรงไม่ได้ ใช้ “ส่งไฟล์ PDF” แทน', true); return;
  }
  const box = document.createElement('div'); box.id = 'tdprint'; box.innerHTML = inner; document.body.appendChild(box); document.body.classList.add('printtd');
  const done = () => { document.body.classList.remove('printtd'); box.remove(); window.removeEventListener('afterprint', done); };
  window.addEventListener('afterprint', done); setTimeout(() => window.print(), 60); setTimeout(done, 60000);
}

function tdShareText(d){

  lines.push('หน้าที่'); dutiesList().forEach(k => { const v = P.duties[k] || {}; const who = (v.who || []).map(nameOf).filter(Boolean); lines.push(`• ${k}: ${who.join(', ') || '-'}${v.st === 'do' ? ' ✅' : v.st === 'didnt' ? ' ❌' : v.st === 'na' ? ' (N/A)' : ''}`); });

async function stickerUpload(file){
  S.stickerImgs = S.stickerImgs || {}; if (Object.keys(S.stickerImgs).length >= 24){ toast('ครบ 24 รูปแล้ว ลบรูปเก่าก่อน', true); return null; }
  const url = URL.createObjectURL(file);
  try{ const im = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const c = document.createElement('canvas'); c.width = c.height = 96; const sc = Math.max(96 / im.width, 96 / im.height); c.getContext('2d').drawImage(im, (96 - im.width * sc) / 2, (96 - im.height * sc) / 2, im.width * sc, im.height * sc);
    const id = uid(); S.stickerImgs[id] = c.toDataURL('image/png'); return 'img:' + id; }
  catch(e){ toast('ใช้รูปนี้ไม่ได้', true); return null; } finally{ URL.revokeObjectURL(url); }
}

}

          if (r.status === 409){ const j = await r.json().catch(() => ({})); throw Object.assign(new Error('conflict'), {code:'conflict', doc: j.doc || null}); }
          if (r.status === 403) throw Object.assign(new Error('รหัสเจ้าของไม่ตรง'), {code:'forbidden'});
          if (!r.ok) throw new Error('HTTP ' + r.status);
        },
        onSnapshot(next, err){
          let last = '__', stop = false;
          const tick = async () => { if (stop || document.hidden) return; try{ const d = await getDoc(p); const k = JSON.stringify(d); if (k !== last){ last = k; next({exists: d != null, data: () => d}); } }catch(e){ if (err) err(e); } };
          tick(); const t = setInterval(tick, 20000); const vis = () => { if (!document.hidden) tick(); };

        }
      };
    },
    async casProbe(){ const r = await fetch(q('vault', '&rev=0&base=-999'), {method:'POST', body:'{}', headers:{'Content-Type':'text/plain'}}); return r.status === 409; },

          if (remember) meta.k = b64(await crypto.subtle.exportKey('raw', key));
          saveMeta();
          const localHas = S.appts.length || S.captures.length || Object.keys(S.shifts).length;
          if (localHas){ conflict = true; dirty = true; state = 'conflict'; banner(); }
          else { S = migrate(data) || S; writeLocal(); meta.base = remote.rev || 0; saveMeta(); state = 'ok'; lastAt = new Date(); }
        } else {
          meta.on = true; meta.base = 0;
          if (remember) meta.k = b64(await crypto.subtle.exportKey('raw', key));
          saveMeta(); dirty = true; await queue();
        }
        log('เปิดซิงก์', state === 'ok' || state === 'conflict'); writeLocal();
        render();
        toast(state === 'ok' ? 'เปิดซิงก์แล้ว' : state === 'conflict' ? 'เลือกข้อมูลที่จะใช้ก่อนซิงก์' : 'เปิดซิงก์ไม่สำเร็จ', state !== 'ok' && state !== 'conflict');
      }catch(e){ state = 'error'; toast('เปิดซิงก์ไม่สำเร็จ', true); refresh(); }
    },
    off(){ meta = {on:false, base:0, salt:null, k:null}; saveMeta(); key = null; conflict = null; banner(); state = 'off'; log('ปิดซิงก์บนเครื่องนี้', true); writeLocal(); render(); toast('ปิดซิงก์บนเครื่องนี้แล้ว ข้อมูลยังอยู่ในเครื่อง'); },
    /* ทดสอบกับคลาวด์จริง: เขียน/อ่าน และล็อกกันสองเครื่อง (ใช้เอกสารทดสอบแยก ไม่แตะข้อมูลจริง) */
    async selfTest(){
      const out = [];
      if (!db || !userId || !testRef) return [{name:'เชื่อมคลาวด์', ok:null, note: STANDALONE ? 'ยังไม่ได้เชื่อมเซิร์ฟเวอร์ซิงก์ (ตั้งค่า › ซิงก์)' : 'ใช้ได้เฉพาะตอนเปิดผ่านลิงก์ claude.ai และลงชื่อเข้าใช้'}];
      try{ const v = Math.random().toString(36).slice(2); await testRef.set({v, at:new Date().toISOString()}); const g = await testRef.get(); out.push({name:'เขียนแล้วอ่านกลับจากคลาวด์', ok: !!(g.exists && g.data().v === v)}); }
      catch(e){ out.push({name:'เขียนแล้วอ่านกลับจากคลาวด์', ok:false, note:String(e && (e.code || e.message) || e)}); }
      if (db.cas){
        try{ const j = await db.ping(); out.push({name:'เซิร์ฟเวอร์รองรับซิงก์ (โค้ดรุ่นใหม่)', ok: !!(j && j.sync), note: j && j.sync ? '' : 'วางโค้ด push-worker.js รุ่นใหม่ใน Cloudflare แล้ว Deploy'}); }catch(e){ out.push({name:'ติดต่อเซิร์ฟเวอร์', ok:false, note:String(e && e.message || e)}); }
        try{ out.push({name:'กันเขียนทับ: เซิร์ฟเวอร์ปฏิเสธการเขียนจากข้อมูลรุ่นเก่า', ok: await db.casProbe()}); }catch(e){ out.push({name:'กันเขียนทับ', ok:false, note:String(e && e.message || e)}); }
        return out;
      }
      const lk = db.doc('data/users/' + userId + '/sync-test-lock');
      if (typeof lk.acquire !== 'function'){ out.push({name:'คลาวด์รองรับระบบล็อก', ok:false, note:'ไม่มีเมธอด acquire'}); return out; }
      try{
        const h1 = 'test-a-' + Date.now(), h2 = 'test-b-' + Date.now();
        const a1 = await lk.acquire({holder:h1, ttlMs:2000}); const a2 = await lk.acquire({holder:h2, ttlMs:2000});
        out.push({name:'คลาวด์รองรับระบบล็อก (เครื่องแรกได้ล็อก)', ok: !!(a1 && a1.acquired)});
        out.push({name:'ระบบล็อกกันเครื่องที่สองระหว่างล็อก', ok: !!(a2 && a2.acquired === false)});
        await new Promise(r => setTimeout(r, 2600));
        const a3 = await lk.acquire({holder:h2, ttlMs:1000});
        out.push({name:'ล็อกหมดอายุเองแล้วเครื่องอื่นได้ต่อ', ok: !!(a3 && a3.acquired)});
      }catch(e){ out.push({name:'คลาวด์รองรับระบบล็อก', ok:false, note:String(e && (e.code || e.message) || e)}); }
      return out;
    },
    async recoverPrev(){
      if (!prevRef || !key){ toast('ต้องเปิดซิงก์ก่อน', true); return; }
      try{ const g = await prevRef.get(); if (!g.exists){ toast('ยังไม่มีรุ่นก่อนหน้าบนคลาวด์', true); return; }
        const data = await open(g.data()); AutoBak.saveData('รุ่นก่อนหน้าบนคลาวด์ (rev ' + (g.data().rev || '?') + ')', JSON.stringify(data)); render(); toast('ดึงรุ่นก่อนหน้ามาไว้ใน สำรองอัตโนมัติ แล้ว กดกู้คืนได้ถ้าต้องการ'); }
      catch(e){ toast('เปิดรุ่นก่อนหน้าไม่ได้ (รหัสไม่ตรงหรือไม่มีข้อมูล)', true); }
    },
    async resolve(which){
      if (!conflict) return;
      if (which === 'remote'){
        try{ AutoBak.save('ก่อนใช้ข้อมูลของอีกเครื่อง (ซิงก์)'); }catch(e){}
        try{
          const snap = await ref.get(); remote = snap.data();
          const data = await open(remote);
          S = migrate(data) || S; writeLocal();
          meta.base = remote.rev || 0; saveMeta(); dirty = false; conflict = null; state = 'ok';
          log('เลือกใช้ข้อมูลของอีกเครื่อง', true); writeLocal();
        }catch(e){ toast('ดึงข้อมูลไม่สำเร็จ', true); return; }
      } else {
        const snap = await ref.get().catch(() => null);
        if (snap && snap.exists){ try{ const other = await open(snap.data()); AutoBak.saveData('ข้อมูลของอีกเครื่องที่ไม่ได้เลือก (ซิงก์)', JSON.stringify(other)); }catch(e){} }
        meta.base = snap && snap.exists ? (snap.data().rev || 0) : 0; remote = snap && snap.exists ? snap.data() : null;
        saveMeta(); conflict = null; dirty = true; await queue();
        log('เลือกใช้ข้อมูลเครื่องนี้', state === 'ok'); writeLocal();
      }
      banner(); render(); toast(state === 'ok' ? 'รวมข้อมูลแล้ว' : 'ยังซิงก์ไม่สำเร็จ', state !== 'ok');
    },
    status(){
      const t = lastAt ? ' ล่าสุด ' + lastAt.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) : '';
      const map = {
        init:'กำลังตรวจว่าซิงก์ได้ไหม…', unavailable: STANDALONE ? 'ยังไม่ได้เชื่อมเซิร์ฟเวอร์ซิงก์ · ใช้เซิร์ฟเวอร์ Cloudflare เดียวกับแจ้งเตือน (secretary-push) ใส่ลิงก์และรหัสเจ้าของด้านล่าง' : 'ซิงก์ใช้ไม่ได้ในหน้านี้ (ต้องเปิดผ่านลิงก์ claude.ai และลงชื่อเข้าใช้) ข้อมูลยังเก็บในเครื่องนี้',
        off:'ปิดอยู่ ข้อมูลเก็บเฉพาะเครื่องนี้', needpass:'ซิงก์เปิดไว้ แต่เครื่องนี้ยังไม่มีรหัส ใส่รหัสเพื่อซิงก์ต่อ',
        ok:'ซิงก์เปิดอยู่' + (db && db.cas ? ' ผ่านเซิร์ฟเวอร์ Cloudflare ของคุณ' : '') + ' ข้อมูลถูกเข้ารหัสในเครื่องก่อนส่ง' + t, saving:'กำลังซิงก์…',
        error:'ซิงก์ไม่สำเร็จ ข้อมูลยังอยู่ในเครื่องนี้ แอปจะลองใหม่เอง หรือกด “ซิงก์ตอนนี้”',
        offline:'ไม่มีอินเทอร์เน็ต ข้อมูลบันทึกในเครื่องแล้ว จะซิงก์เองเมื่อเน็ตกลับมา',
        forbidden:'รหัสเจ้าของไม่ตรงกับเซิร์ฟเวอร์ ตรวจรหัสเจ้าของในหัวข้อซิงก์',
        stuck:'ยังไม่ได้ขึ้นคลาวด์ (ลองอัตโนมัติครบ 4 ครั้งแล้ว) ข้อมูลยังอยู่ในเครื่องนี้ กด “ซิงก์ตอนนี้” เพื่อลองอีกครั้ง', conflict:'ข้อมูลสองเครื่องไม่ตรงกัน เลือกชุดที่จะใช้จากแถบด้านบน',
        badkey:'รหัสบนเครื่องนี้เปิดข้อมูลบนคลาวด์ไม่ได้ ปิดซิงก์แล้วเปิดใหม่ด้วยรหัสที่ถูกต้อง'
      };
      return {available: state !== 'unavailable' && state !== 'init', on: meta.on && !!key && state !== 'needpass', text: (map[state] || '') + (dirty && meta.on && state !== 'saving' ? ' · มีการแก้ที่ยังไม่ขึ้นคลาวด์' : '') + (lockMode === 'none' && !(db && db.cas) ? ' · คลาวด์นี้ไม่มีระบบล็อก (เสี่ยงเขียนทับ)' : ''), lockMode};
    }
  };
})();

/* ---------- start ---------- */
loadLocal();
cleanOld(false);
Theme.apply();
readRoute();
render();
if (!storageOK) toast('เครื่องนี้ไม่อนุญาตให้เก็บข้อมูล สิ่งที่จดจะหายเมื่อปิดหน้า', true);
Sync.boot();
setInterval(() => { if (route === 'myday' && !$('#layer').innerHTML) render(); }, 60000);
setTimeout(() => Noti.check(), 1500);
if (NATIVE){ setTimeout(() => { NNoti.checkExact(); NNoti.sync().then(() => { if (route === 'config') render(); }); }, 1500);
  const AppP = NPlug('App'); if (AppP && AppP.addListener) AppP.addListener('backButton', () => { if ($('#layer') && $('#layer').innerHTML){ closeSheet(); } else if (document.querySelector('.tov')){ const ov = document.querySelector('.tov'); if (ov._close) ov._close(); } else if (route !== 'myday'){ location.hash = '#myday'; } else if (AppP.exitApp) AppP.exitApp(); });
  if (AppP && AppP.addListener) AppP.addListener('resume', () => { NNoti.sync(); }); }
if (STANDALONE){ AutoBak.daily(); setTimeout(() => { Updater.check(false); WPush.sync().then(() => { if (route === 'config') render(); }); }, 2500); setInterval(() => Updater.check(false), 1800000); document.addEventListener('visibilitychange', () => { if (!document.hidden) Updater.check(false); }); } setInterval(() => Noti.check(), 300000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) Noti.check(); });
})();
</script>

  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, id = el.dataset.id;
  if (el.tagName === 'INPUT' && el.type === 'checkbox' && !['tick','def-remind','pw-toggle','case-done','skin','gcal','assign','tri','cohol','cls','push'].includes(act)) return;
  if (el.tagName === 'INPUT' && el.type !== 'checkbox') return;
  switch(act){
    case 'close': closeSheet(); break;
    case 'new-appt': apptForm(null, {date: el.dataset.date}); break;
    case 'edit-appt': apptForm(S.appts.find(a => a.id === id)); break;
    case 'appt-tab': apptTab = el.dataset.k; render(); break;
    case 'appt-del': {
      const a = S.appts.find(x => x.id === id); if (!a) break;
      confirmSheet(`ลบ “${a.title}”?${a.gcalId ? ' (การเตือนใน Google Calendar จะถูกลบด้วย)' : ''}`, 'ลบรายการนี้', () => { S.appts = S.appts.filter(x => x.id !== id); commit('ลบนัด: ' + a.title, {msg:'ลบแล้ว'}); if (a.gcalId) Push.remove(a).then(ok => { if (!ok) toast('ลบในแอปแล้ว แต่ลบใน Google Calendar ไม่สำเร็จ ลบเองในปฏิทินได้', true); }); }, true);
      break;
    }
    case 'appt-done': {
      const a = S.appts.find(x => x.id === id); if (!a) break;
      a.done = !a.done; closeSheet(); commit((a.done ? 'ทำเสร็จ: ' : 'เปิดใหม่: ') + a.title);
      if (a.done && a.gcalId) Push.remove(a).then(() => writeLocal()); else if (!a.done && S.settings.push) Push.sync(a, true);
      break;
    }
    case 'tick': {
      const t = today(); S.routineLog[t] = S.routineLog[t] || {};
      S.routineLog[t][id] = el.checked; commit('รูทีน: ' + ((S.routines.find(r => r.id === id) || {}).label || ''), {silent:true});
      break;
    }
    case 'cap-new': captureSheet(el.dataset.k); break;
    case 'tri': { const t = today(); S.routineLog[t] = S.routineLog[t] || {};
      if (!el.checked) delete S.routineLog[t][id]; else S.routineLog[t][id] = el.dataset.v;
      commit('Incharge: ' + el.dataset.v, {silent:true}); break; }
    case 'assign': { const t = today(); const a = new Set(S.assign[t] || []); if (el.checked) a.add(el.dataset.k); else a.delete(el.dataset.k);
      S.assign[t] = [...a]; commit('หน้าที่วันนี้', {silent:true}); break; }
    case 'idea-tab': ideaTab = el.dataset.k; render(); break;
    case 'case-new': caseSheet(null, el.dataset.d || today()); break;
    case 'case-edit': { const d = el.dataset.d || today(); caseSheet((S.cases[d] || []).find(c => c.id === id), d); break; }
    case 'case-done': { const d = el.dataset.d || today(); const c = (S.cases[d] || []).find(x => x.id === id); if (!c) break; c.done = el.checked; commit('เคสเสร็จ: ' + caseTitle(c), {silent:true}); break; }
    case 'case-del': { const d = el.dataset.d || today(); const c = (S.cases[d] || []).find(x => x.id === id); if (!c) break;
      confirmSheet('ลบเคสนี้?', 'ลบเคส', () => { S.cases[d] = S.cases[d].filter(x => x.id !== id); if (!S.cases[d].length) delete S.cases[d]; commit('ลบเคส', {msg:'ลบแล้ว'}); }, true); break; }
    case 'cls': { const f = el.closest('form'); if (f && el.checked){ const other = f.querySelector(el.name === 'major' ? 'input[name=minor]' : 'input[name=major]'); if (other) other.checked = false; } updateCaseCalc(f); break; }
    case 'mins': { const f = el.closest('form'); if (f){ f.elements.mins.value = el.dataset.n; if (f.elements.end) f.elements.end.value = ''; updateCaseCalc(f); } break; }
    case 'rt-new': routineSheet(); break;
    case 'rt-edit': routineSheet(S.routines.find(x => x.id === id)); break;
    case 'theme': S.settings.theme = el.dataset.k; Theme.apply(); commit('เปลี่ยนโหมดสี', {msg:'เปลี่ยนแล้ว'}); break;
    case 'accent': S.settings.accent = el.dataset.k; Theme.apply(); commit('เปลี่ยนสีหลัก', {msg:'เปลี่ยนสีแล้ว'}); break;
    case 'skin': S.settings.skin = el.checked ? 'angel' : 'plain'; Theme.apply(); commit('เปลี่ยนธีม', {msg: el.checked ? 'ใช้ธีมนางฟ้าพยาบาลแล้ว' : 'ปิดธีมแล้ว'}); break;
    case 'gcal': S.settings.gcal[el.dataset.k] = el.checked; GCal.clear(); if (el.checked && el.dataset.k === 'primary') setTimeout(() => GCal.test(), 50); commit(el.checked ? 'เปิดอ่าน Google Calendar' : 'ปิดอ่าน Google Calendar', {msg: el.checked ? 'เปิดแล้ว ข้อมูลจะขึ้นในหน้าตาราง' : 'ปิดแล้ว'}); break;
    case 'gcal-retry': GCal.retry(el.dataset.m); break;
    case 'roster': Roster.open(); break;
    case 'ts-day': tsDaySheet(el.dataset.d); break;
    case 'share': shareSheet(); break;
    case 'team-mon': { const [y,m] = teamMonth.split('-').map(Number); teamMonth = ymd(new Date(y, m-1+Number(el.dataset.d), 1)).slice(0,7); teamDay = teamMonth === today().slice(0,7) ? today() : teamMonth + '-01'; render(); break; }
    case 'team-day': teamDay = el.dataset.d; render(); break;
    case 'team-cell': teamDay = el.dataset.d; teamCellSheet(el.dataset.id, el.dataset.d); break;
    case 'team-member': teamMemberSheet(el.dataset.id); break;
    case 'team-add': teamMemberSheet(null); break;
    case 'team-del': confirmSheet('ลบเพื่อนคนนี้และเวรทั้งหมดของเขา?', 'ลบ', () => { const T = team(); T.members = T.members.filter(x => x.id !== el.dataset.id); Object.values(T.months).forEach(mo => { delete mo[el.dataset.id]; }); commit('ลบเพื่อนในทีม', {msg:'ลบแล้ว'}); }, true); break;
    case 'team-swap': teamSwapSheet(el.dataset.d || teamDay, el.dataset.id || ''); break;
    case 'team-import': teamImportSheet(); break;
    case 'team-apply': applyTeamPending(); break;
    case 'team-prompt': { const txt = teamPrompt(teamMonth); const done = ok => toast(ok ? 'คัดลอกคำสั่งแล้ว ไปวางในแอป Claude พร้อมรูป' : 'คัดลอกไม่ได้ ลองกดค้างที่ข้อความ', !ok);
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => done(true), () => done(false)); else done(false); break; }
    case 'team-history': teamHistorySheet(); break;
    case 'swap-copy': { const f = el.closest('form'); const ta = f && f.elements.msg; if (!ta) break; ta.select(); let ok = false; try{ ok = document.execCommand('copy'); }catch(e){} if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(() => toast('คัดลอกแล้ว ไปวางใน LINE ได้เลย'), () => toast(ok ? 'คัดลอกแล้ว' : 'กดค้างที่ข้อความแล้วเลือกคัดลอก', !ok)); else toast(ok ? 'คัดลอกแล้ว' : 'กดค้างที่ข้อความแล้วเลือกคัดลอก', !ok); break; }
    case 'swap-undo': { const T = team(); const x = T.swaps[Number(el.dataset.i)]; if (!x || x.undone) break;
      confirmSheet('ย้อนการแลกเวรนี้ กลับเป็นเวรเดิมของทั้งสองคน?', 'ย้อนกลับ', () => { x.before.forEach(b => { setTeamCodes(x.a, b.d, b.A); setTeamCodes(x.b, b.d, b.B); }); x.undone = true; closeSheet(); commit('ย้อนการแลกเวร ' + x.aName + ' ↔ ' + x.bName, {msg:'ย้อนกลับแล้ว'}); }); break; }
    case 'app-check': Updater.check(true); break;
    case 'app-update': Updater.update(); break;
    case 'bak-restore': { const b = AutoBak.list()[Number(el.dataset.i)]; if (!b) break; confirmSheet('กู้คืนข้อมูลจาก ' + b.at.slice(0,16).replace('T',' ') + ' ? ข้อมูลตอนนี้จะถูกสำรองไว้ก่อน', 'กู้คืน', () => AutoBak.restore(Number(el.dataset.i))); break; }
    case 'push-setup': pushSetupSheet(); break;
    case 'wpush-test': WPush.test(); break;
    case 'wpush-sync': WPush.sync().then(ok => { toast(ok ? 'ซิงก์แล้ว' : WPush.status, !ok); render(); }); break;
    case 'wpush-off': WPush.off(); toast('ปิดแจ้งเตือนจริงแล้ว'); break;
    case 'noti-on': Noti.enable(); break;
    case 'noti-off': S.settings.noti = false; commit('ปิดแจ้งเตือนของแอป', {msg:'ปิดแล้ว'}); break;
    case 'link-new': linkSheet(); break;
    case 'link-edit': linkSheet(S.links.find(x => x.id === id)); break;
    case 'link-mode': linkEdit = !linkEdit; render(); break;
    case 'hadj': { const f = el.closest('form'); if (!f) break;
      if (el.dataset.k === 'clear'){ f.elements.plus.value = ''; f.elements.minus.value = ''; }
      else { const inp = f.elements[el.dataset.k]; inp.value = String(Math.round(((Number(inp.value) || 0) + Number(el.dataset.n)) * 100) / 100); }
      const p2 = Number(f.elements.plus.value) || 0, m2 = Number(f.elements.minus.value) || 0; const hs = f.querySelector('#hsum'); if (hs) hs.textContent = `สุทธิวันนี้ ${p2 - m2 >= 0 ? '+' : '−'}${Math.abs(p2 - m2)} ชม.`; break; }
    case 'hol-month': { const ym = el.dataset.m; const H = hoursFor(ym); const all = H.holDays >= H.coDays;
      (S.coHol || []).filter(h => h[2] && h[0].startsWith(ym)).forEach(h => { if (all) delete S.holCredit[h[0]]; else S.holCredit[h[0]] = true; });
      commit(all ? 'ยกเลิกนับวันหยุดบริษัท ' + ym : 'นับวันหยุดบริษัท ' + ym, {msg: all ? 'ยกเลิกแล้ว' : 'นับวันหยุดบริษัทแล้ว'}); break; }
    case 'install': if (installEvt){ installEvt.prompt(); installEvt.userChoice.then(r => { if (r.outcome !== 'accepted') toast('ยังไม่ได้ติดตั้ง กดใหม่ได้ทุกเมื่อ'); installEvt = null; render(); }); } break;
    case 'install-help': openSheet(`${sheetHead('ติดตั้ง / หาแอปไม่เจอ')}
      <p style="margin:0;font-size:14.5px"><b>ถ้า Chrome ขึ้นว่า “ติดตั้งแอปนี้แล้ว”</b> แปลว่าแอปอยู่ในเครื่องแล้ว แต่ไอคอนอาจไม่ได้อยู่บนหน้าจอหลัก</p>
      <ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14.5px">
        <li>ปัดหน้าจอขึ้นเพื่อเปิด<b>ลิ้นชักแอป</b> พิมพ์ค้นหา <b>เลขาส่วนตัว</b> ถ้าเจอ กดค้าง › <b>เพิ่มไปยังหน้าจอหลัก</b></li>
        <li>ถ้าไม่เจอ หรือกดแล้วไม่เปิด: <b>ตั้งค่ามือถือ › แอปพลิเคชัน › เลขาส่วนตัว › ถอนการติดตั้ง</b></li>
        <li>ปิด Chrome ให้สนิท แล้วเปิดลิงก์แอปใหม่ › กด <b>ติดตั้ง</b> อีกครั้ง</li>
        <li>iPhone: Safari › ปุ่มแชร์ › <b>เพิ่มไปยังหน้าจอโฮม</b></li>
      </ol>
      <div class="banner appt" style="margin:0"><div><b>ห้ามกด “ลบข้อมูลและรีเซ็ตสิทธิ์”</b> ในการตั้งค่าเว็บไซต์ของ Chrome เพราะจะลบข้อมูลของทุกแอปบนเว็บนี้ (รวมชำดี POS) ถ้าจำเป็นต้องกด ให้ดาวน์โหลดไฟล์สำรองของทุกแอปก่อน</div></div>`); break;
    case 'ics': exportIcs(); break;
    case 'exp-all': exportAll(el.dataset.k); break;
    case 'go-form': tsTab = el.dataset.k; tsMonth = el.dataset.m || today().slice(0,7); if (route === 'timesheet') render(); else location.hash = '#timesheet'; window.scrollTo(0,0); break;
    case 'sum-copy': { const ta = $('#sum-txt'); if (!ta) break; ta.select(); let ok = false; try{ ok = document.execCommand('copy'); }catch(e){} if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(() => toast('คัดลอกแล้ว'), () => toast(ok ? 'คัดลอกแล้ว' : 'กดค้างที่ข้อความแล้วเลือกคัดลอก', !ok)); else toast(ok ? 'คัดลอกแล้ว' : 'กดค้างที่ข้อความแล้วเลือกคัดลอก', !ok); break; }
    case 'sum-share': { const ta = $('#sum-txt'); if (ta && navigator.share) navigator.share({text: ta.value}).catch(() => {}); break; }
    case 'frow': rowEditor(el.dataset.fk, el.dataset.ym, el.dataset.rk); break;
    case 'frow-new': { const E = fed(el.dataset.fk, el.dataset.ym); E.add = E.add || []; const nid = 'x' + uid(); E.add.push({id:nid}); writeLocal(); rowEditor(el.dataset.fk, el.dataset.ym, nid); break; }
    case 'frow-del': { const E = fed(el.dataset.fk, el.dataset.ym); E.add = (E.add || []).filter(a => a.id !== el.dataset.rk); delete E.r[el.dataset.rk]; closeSheet(); commit('ลบแถวในฟอร์ม', {msg:'ลบแถวแล้ว'}); break; }
    case 'frow-reset': { const E = fed(el.dataset.fk, el.dataset.ym); delete E.r[el.dataset.rk]; closeSheet(); commit('คืนค่าแถวในฟอร์ม', {msg:'คืนค่าเดิมแล้ว'}); break; }
    case 'fmeta': metaEditor(el); break;
    case 'fmeta-reset': { if (S.formMeta) delete S.formMeta[el.dataset.gk]; closeSheet(); commit('คืนค่าหัวฟอร์ม', {msg:'คืนค่าเดิมแล้ว'}); break; }
    case 'tstab': tsTab = el.dataset.k; render(); window.scrollTo(0,0); break;
    case 'form-pdf': formPdf(el.dataset.k); break;
    case 'form-xlsx': formXlsx(el.dataset.k); break;
    case 'form-print': { const land = !!document.querySelector('#pwrap .paper.land'); let st = document.getElementById('print-page'); if (!st){ st = document.createElement('style'); st.id = 'print-page'; document.head.appendChild(st); } st.textContent = `@page{size:A4 ${land ? 'landscape' : 'portrait'};margin:0}`; try{ window.print(); }catch(e){ toast('หน้านี้สั่งพิมพ์ไม่ได้ ใช้บันทึกเป็น PDF แล้วพิมพ์จากไฟล์', true); } break; }
    case 'form-add': { const E = fed(el.dataset.k, tsMonth); E.add = E.add || []; E.add.push({id:'x' + uid()}); commit('เพิ่มแถวในฟอร์ม', {msg:'เพิ่มแถวแล้ว แตะช่องเพื่อพิมพ์'}); break; }
    case 'form-zoom': formZoom = !formZoom; render(); break;
    case 'logo-pick': { const u = document.querySelector('[data-act=logo-upload]'); if (u) u.click(); break; }
    case 'logo-del': try{ localStorage.removeItem(LS_LOGO); }catch(e){} render(); toast('ลบโลโก้แล้ว'); break;
    case 'form-reset': confirmSheet('ล้างสิ่งที่แก้เองในฟอร์มเดือนนี้ (ช่องสีเหลืองและแถวที่เพิ่มเอง)? หัวกระดาษที่แก้ไว้ยังอยู่', 'ล้าง', () => { delete S.formEdits[fkey(el.dataset.k, tsMonth)]; commit('ล้างการแก้ไขฟอร์ม', {msg:'ล้างแล้ว'}); }, true); break;
    case 'push': S.settings.push = el.checked; commit(el.checked ? 'เปิดเด้งเตือนผ่าน Google Calendar' : 'ปิดเด้งเตือนผ่าน Google Calendar', {msg: el.checked ? 'เปิดแล้ว กดทดสอบการเชื่อมต่อได้' : 'ปิดแล้ว'}); if (el.checked) Push.test(); break;
    case 'push-test': Push.test(); break;
    case 'push-all': Push.syncAll(); break;
    case 'claude-remind': claudeSheet(); break;
    case 'cl-copy': { const ta = $('#cl-txt'); if (!ta) break; ta.select(); let ok = false; try{ ok = document.execCommand('copy'); }catch(e){} if (navigator.clipboard) navigator.clipboard.writeText(ta.value).then(() => toast('คัดลอกแล้ว ไปวางในแชตกับ Claude'), () => toast(ok ? 'คัดลอกแล้ว' : 'กดค้างที่ข้อความแล้วเลือกคัดลอก', !ok)); else toast(ok ? 'คัดลอกแล้ว' : 'กดค้างที่ข้อความแล้วเลือกคัดลอก', !ok); break; }
    case 'ts-mon': { const [y,m] = tsMonth.split('-').map(Number); tsMonth = ymd(new Date(y, m-1+Number(el.dataset.d), 1)).slice(0,7); render(); break; }
    case 'ts-xlsx': exportTimesheet(tsMonth); break;
    case 'bgcolor': S.settings.bgColor = el.dataset.k; Theme.apply(); commit('เปลี่ยนสีพื้นหลัง', {msg:'เปลี่ยนพื้นหลังแล้ว'}); break;
    case 'cohol': { const h = (S.coHol || []).find(x => x[0] === el.dataset.d); if (h){ h[2] = el.checked; commit('แก้วันหยุดบริษัท ' + h[1], {silent:true}); } break; }

    case 'rs-mon': Roster.shiftMonth(Number(el.dataset.d)); break;

    case 'rs-save': Roster.saveMonth(); break;

    case 'clean-now': confirmSheet('ลบรายละเอียดรายวัน (รูทีน รายชั่วโมง เคส หน้าที่) ที่เก่ากว่า ' + S.settings.keepDays + ' วัน และนัดที่เสร็จแล้ว? เวรและค่าเวรเก็บไว้ 400 วัน', 'ล้างข้อมูลเก่า', () => { const n = cleanOld(true); render(); toast(n ? 'ล้างแล้ว ' + n + ' รายการ' : 'ไม่มีข้อมูลเก่าให้ล้าง'); }, true); break;

      const c = S.captures.find(x => x.id === id); if (!c) break;
      apptForm(null, {title:c.text, capId:c.id}); break;

    case 'rt-del': {
      const r = S.routines.find(x => x.id === id); if (!r) break;
      confirmSheet(`ลบรูทีน “${r.label}”?`, 'ลบรูทีน', () => { S.routines = S.routines.filter(x => x.id !== id); commit('ลบรูทีน: ' + r.label, {msg:'ลบแล้ว'}); }, true);
      break;
    }
    case 'rt-up': { const i = Number(el.dataset.i); if (i > 0){ const a = S.routines; [a[i-1], a[i]] = [a[i], a[i-1]]; commit('เรียงรูทีนใหม่', {silent:true}); } break; }

      const l = S.links.find(x => x.id === id); if (!l) break;
      confirmSheet(`ลบลิงก์ “${l.name}”?`, 'ลบลิงก์', () => { S.links = S.links.filter(x => x.id !== id); commit('ลบลิงก์: ' + l.name, {msg:'ลบแล้ว'}); }, true);
      break;

  let meta = {on:false, base:0, salt:null, k:null};
  let remote = null, dirty = false, timer = null, chain = Promise.resolve();
  let state = 'init', lastAt = null, conflict = null, pending = 0;
  try{ meta = Object.assign(meta, JSON.parse(localStorage.getItem(LS_SYNC) || '{}')); }catch(e){}
  const saveMeta = () => { try{ localStorage.setItem(LS_SYNC, JSON.stringify(meta)); }catch(e){} };

  async function derive(pass, saltB64){
    const base = await crypto.subtle.importKey('raw', enc.encode(pass), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey({name:'PBKDF2', salt:unb64(saltB64), iterations:250000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, true, ['encrypt','decrypt']);
  }
  async function seal(obj){
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(JSON.stringify(obj)));
    return {iv:b64(iv), ct:b64(ct)};
  }
  async function open(doc){
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:unb64(doc.iv)}, key, unb64(doc.ct));
    return JSON.parse(dec.decode(pt));
  }
  function banner(){
    const old = document.getElementById('conflict'); if (old) old.remove();
    if (!conflict) return;
    const el = document.createElement('div');
    el.id = 'conflict'; el.className = 'banner appt'; el.setAttribute('role','alert');
    el.style.cssText = 'position:fixed;left:12px;right:12px;top:calc(12px + env(safe-area-inset-top,0px));z-index:30;max-width:520px;margin:0 auto;flex-direction:column';
    el.innerHTML = `<strong>ข้อมูลบนเครื่องนี้กับอีกเครื่องไม่ตรงกัน</strong><span style="font-size:13px">ทั้งสองเครื่องมีการแก้ไขที่ยังไม่ได้รวมกัน เลือกว่าจะใช้ข้อมูลชุดไหน อีกชุดจะถูกแทนที่</span>
      <div class="row" style="flex-wrap:wrap"><button type="button" class="btn small" data-act="conflict-remote">ใช้ของอีกเครื่อง</button><button type="button" class="btn small" data-act="conflict-local">ใช้ของเครื่องนี้</button></div>`;
    document.body.appendChild(el);
  }
  async function onRemote(snap){
    if (!snap.exists){ remote = null; return; }
    remote = snap.data();
    if (!key || !meta.on) return;
    if ((remote.rev || 0) <= meta.base || (pending && remote.rev === pending)) return;
    if (dirty){ conflict = true; state = 'conflict'; banner(); refresh(); return; }
    try{
      const data = await open(remote);
      S = migrate(data) || S; writeLocal();
      meta.base = remote.rev; saveMeta(); lastAt = new Date(); state = 'ok';
      Theme.apply(); render();
    }catch(e){ state = 'badkey'; refresh(); }
  }
  function refresh(){ if (route === 'config') render(); }
  async function push(){
    if (!key || !meta.on || !ref || conflict) return;
    if (remote && (remote.rev || 0) > meta.base){ conflict = true; state = 'conflict'; banner(); refresh(); return; }
    state = 'saving';
    try{
      const sealed = await seal(S);
      const rev = meta.base + 1;
      pending = rev;
      await ref.set({rev, salt:meta.salt, iv:sealed.iv, ct:sealed.ct, at:new Date().toISOString()});
      meta.base = rev; pending = 0; saveMeta(); dirty = false; lastAt = new Date(); state = 'ok';
      log('ซิงก์ขึ้นคลาวด์', true); writeLocal();
    }catch(e){ pending = 0; state = 'error'; log('ซิงก์ขึ้นคลาวด์', false); writeLocal(); }
    refresh();
  }
  function queue(){ chain = chain.then(push).catch(() => {}); return chain; }
  async function boot(){
    if (!window.claude || !window.claude.use){ state = 'unavailable'; return; }
    try{
      db = await window.claude.use('db');
      const user = await window.claude.use('user');
      userId = user ? await user.id() : null;
    }catch(e){ db = null; }
    if (!db || !userId){ state = 'unavailable'; refresh(); return; }
    ref = db.doc('data/users/' + userId + '/vault');
    state = 'off';
    if (meta.on && meta.k){
      try{
        key = await crypto.subtle.importKey('raw', unb64(meta.k), {name:'AES-GCM'}, true, ['encrypt','decrypt']);
        state = 'ok';
      }catch(e){ key = null; state = 'needpass'; }
    } else if (meta.on){ state = 'needpass'; }
    unsub = ref.onSnapshot(snap => { onRemote(snap); }, () => { state = 'error'; refresh(); });
    refresh();
  }
  return {
    boot,
    reset(){ meta = {on:false, base:0, salt:null, k:null}; key = null; dirty = false; conflict = null; banner(); state = db ? 'off' : 'unavailable'; },
    markDirty(){ if (!meta.on || !key) return; dirty = true; clearTimeout(timer); timer = setTimeout(queue, 1500); },
    pushNow(){ clearTimeout(timer); dirty = true; queue().then(() => toast(state === 'ok' ? 'ซิงก์แล้ว' : state === 'conflict' ? 'ยังไม่ได้ซิงก์: ข้อมูลสองเครื่องไม่ตรงกัน' : 'ซิงก์ไม่สำเร็จ', state !== 'ok')); },
    async on(pass, remember){
      if (!ref){ toast('ซิงก์ใช้ไม่ได้ในหน้านี้', true); return; }
      if (pass.length < 8){ toast('รหัสผ่านอย่างน้อย 8 ตัว', true); return; }
      try{
        const snap = await ref.get();
        remote = snap.exists ? snap.data() : null;
        meta.salt = remote ? remote.salt : b64(crypto.getRandomValues(new Uint8Array(16)));
        key = await derive(pass, meta.salt);
        if (remote){
          let data;
          try{ data = await open(remote); }catch(e){ key = null; toast('รหัสผ่านไม่ตรงกับข้อมูลบนคลาวด์', true); return; }
          meta.on = true; meta.base = 0;
          if (remember) meta.k = b64(await crypto.subtle.exportKey('raw', key));
          saveMeta();
          const localHas = S.appts.length || S.captures.length || Object.keys(S.shifts).length;
          if (localHas){ conflict = true; dirty = true; state = 'conflict'; banner(); }
          else { S = migrate(data) || S; writeLocal(); meta.base = remote.rev || 0; saveMeta(); state = 'ok'; lastAt = new Date(); }
        } else {
          meta.on = true; meta.base = 0;
          if (remember) meta.k = b64(await crypto.subtle.exportKey('raw', key));
          saveMeta(); dirty = true; await queue();
        }
        log('เปิดซิงก์', state === 'ok' || state === 'conflict'); writeLocal();
        render();
        toast(state === 'ok' ? 'เปิดซิงก์แล้ว' : state === 'conflict' ? 'เลือกข้อมูลที่จะใช้ก่อนซิงก์' : 'เปิดซิงก์ไม่สำเร็จ', state !== 'ok' && state !== 'conflict');
      }catch(e){ state = 'error'; toast('เปิดซิงก์ไม่สำเร็จ', true); refresh(); }
    },
    off(){ meta = {on:false, base:0, salt:null, k:null}; saveMeta(); key = null; conflict = null; banner(); state = 'off'; log('ปิดซิงก์บนเครื่องนี้', true); writeLocal(); render(); toast('ปิดซิงก์บนเครื่องนี้แล้ว ข้อมูลยังอยู่ในเครื่อง'); },
    async resolve(which){
      if (!conflict) return;
      if (which === 'remote'){
        try{
          const snap = await ref.get(); remote = snap.data();
          const data = await open(remote);
          S = migrate(data) || S; writeLocal();
          meta.base = remote.rev || 0; saveMeta(); dirty = false; conflict = null; state = 'ok';
          log('เลือกใช้ข้อมูลของอีกเครื่อง', true); writeLocal();
        }catch(e){ toast('ดึงข้อมูลไม่สำเร็จ', true); return; }
      } else {
        const snap = await ref.get().catch(() => null);
        meta.base = snap && snap.exists ? (snap.data().rev || 0) : 0; remote = snap && snap.exists ? snap.data() : null;
        saveMeta(); conflict = null; dirty = true; await queue();
        log('เลือกใช้ข้อมูลเครื่องนี้', state === 'ok'); writeLocal();
      }
      banner(); render(); toast(state === 'ok' ? 'รวมข้อมูลแล้ว' : 'ยังซิงก์ไม่สำเร็จ', state !== 'ok');
    },
    status(){
      const t = lastAt ? ' ล่าสุด ' + lastAt.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'}) : '';
      const map = {
        init:'กำลังตรวจว่าซิงก์ได้ไหม…', unavailable: STANDALONE ? 'เวอร์ชัน GitHub ยังไม่มีซิงก์ ย้ายข้อมูลระหว่างเครื่องด้วย “ดาวน์โหลดไฟล์สำรอง” แล้ว “นำเข้าไฟล์สำรอง”' : 'ซิงก์ใช้ไม่ได้ในหน้านี้ (ต้องเปิดผ่านลิงก์ claude.ai และลงชื่อเข้าใช้) ข้อมูลยังเก็บในเครื่องนี้',
        off:'ปิดอยู่ ข้อมูลเก็บเฉพาะเครื่องนี้', needpass:'ซิงก์เปิดไว้ แต่เครื่องนี้ยังไม่มีรหัส ใส่รหัสเพื่อซิงก์ต่อ',
        ok:'ซิงก์เปิดอยู่ ข้อมูลถูกเข้ารหัสในเครื่องก่อนส่ง' + t, saving:'กำลังซิงก์…',
        error:'ซิงก์ไม่สำเร็จ ข้อมูลยังอยู่ในเครื่องนี้ ลอง “ซิงก์ตอนนี้” อีกครั้ง', conflict:'ข้อมูลสองเครื่องไม่ตรงกัน เลือกชุดที่จะใช้จากแถบด้านบน',
        badkey:'รหัสบนเครื่องนี้เปิดข้อมูลบนคลาวด์ไม่ได้ ปิดซิงก์แล้วเปิดใหม่ด้วยรหัสที่ถูกต้อง'
      };
      return {available: state !== 'unavailable' && state !== 'init', on: meta.on && !!key && state !== 'needpass', text: map[state] || ''};
    }
  };
})();

/* ---------- start ---------- */
loadLocal();
cleanOld(false);
Theme.apply();
readRoute();
render();
if (!storageOK) toast('เครื่องนี้ไม่อนุญาตให้เก็บข้อมูล สิ่งที่จดจะหายเมื่อปิดหน้า', true);
Sync.boot();
setInterval(() => { if (route === 'myday' && !$('#layer').innerHTML) render(); }, 60000);
setTimeout(() => Noti.check(), 1500);
if (STANDALONE){ AutoBak.daily(); setTimeout(() => { Updater.check(false); WPush.sync().then(() => { if (route === 'config') render(); }); }, 2500); setInterval(() => Updater.check(false), 1800000); document.addEventListener('visibilitychange', () => { if (!document.hidden) Updater.check(false); }); } setInterval(() => Noti.check(), 300000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) Noti.check(); });
})();
</script>

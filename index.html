<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#7A4CC2">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="เลขาส่วนตัว">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เลขาส่วนตัว v1.10</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Kanit:wght@500&family=Mali:wght@600&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --ink:#1B2030; --muted:#5A6275; --line:#E1E5EE; --soft:#EEF0F5; --field:#D5DAE5;
  --primary:#2448B8; --primary-tint:#E6ECFB; --primary-ink:#1A3690;
  --work:#2448B8; --work-t:#E6ECFB; --work-i:#1A3690;
  --appt:#A84A0C; --appt-t:#FDEEDF; --appt-i:#7E370A;
  --money:#1C6E46; --money-t:#E2F2E9; --money-i:#145234;
  --proj:#6440B8; --proj-t:#EFE9FB; --proj-i:#4B2F8C;
  --life:#A8204F; --life-t:#FCE7EF; --life-i:#7F183C;
  --warn-t:#FDEEDF; --warn-i:#7E370A; --scrim:rgba(20,24,38,.45);
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151E; --surface:#1C2130; --ink:#E9ECF4; --muted:#A3AAC0; --line:#2C3346; --soft:#252B3C; --field:#3A4259;
    --primary:#7D97F0; --primary-tint:#243055; --primary-ink:#B9C8FA;
    --work:#7D97F0; --work-t:#243055; --work-i:#B9C8FA;
    --appt:#F0A060; --appt-t:#3D2A1A; --appt-i:#F6C9A0;
    --money:#5CC08D; --money-t:#1B3A2B; --money-i:#A8E3C4;
    --proj:#A88BEA; --proj-t:#2F2550; --proj-i:#D3C5F6;
    --life:#EE7FA6; --life-t:#45202F; --life-i:#F7BCD1;
    --warn-t:#3D2A1A; --warn-i:#F6C9A0; --scrim:rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151E; --surface:#1C2130; --ink:#E9ECF4; --muted:#A3AAC0; --line:#2C3346; --soft:#252B3C; --field:#3A4259;
  --primary:#7D97F0; --primary-tint:#243055; --primary-ink:#B9C8FA;
  --work:#7D97F0; --work-t:#243055; --work-i:#B9C8FA;
  --appt:#F0A060; --appt-t:#3D2A1A; --appt-i:#F6C9A0;
  --money:#5CC08D; --money-t:#1B3A2B; --money-i:#A8E3C4;
  --proj:#A88BEA; --proj-t:#2F2550; --proj-i:#D3C5F6;
  --life:#EE7FA6; --life-t:#45202F; --life-i:#F7BCD1;
  --warn-t:#3D2A1A; --warn-i:#F6C9A0; --scrim:rgba(0,0,0,.6);
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans Thai',system-ui,sans-serif;font-size:15px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app{max-width:520px;margin:0 auto;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px))}
header.top{padding:18px 4px 10px;display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{margin:0;font-family:'Kanit','IBM Plex Sans Thai',sans-serif;font-weight:500;font-size:24px;line-height:1.3}
h2{margin:0;font-size:15px;font-weight:600}
.sub{font-size:13px;color:var(--muted)}
.card{background:var(--surface);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;box-shadow:0 1px 0 var(--line);margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.btn{min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--field);background:var(--surface);cursor:pointer;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
:root[data-theme="dark"] .btn.primary{color:#12151E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#12151E}}
.btn.appt{background:var(--appt);border-color:var(--appt);color:#fff;font-weight:600}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.appt{color:#12151E}}
:root[data-theme="dark"] .btn.appt{color:#12151E}
.btn.ghost{border-color:transparent;background:transparent;color:var(--primary);font-weight:600}
.btn.danger{color:var(--life);border-color:var(--life)}
.btn.small{min-height:36px;padding:0 12px;font-size:13px;border-radius:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--field);background:var(--surface);font-size:13px;cursor:pointer}
.chip input{margin:0;accent-color:var(--primary)}
.chip:has(input:checked){border:2px solid var(--primary);background:var(--primary-tint);color:var(--primary-ink);font-weight:500}
.dot{width:8px;height:8px;border-radius:4px;flex:none;display:inline-block}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;padding:2px 9px;border-radius:999px;font-weight:500}
.field{min-height:44px;width:100%;border-radius:10px;border:1px solid var(--field);background:var(--surface);padding:0 12px;font-size:15px}
textarea.field{padding:10px 12px;min-height:96px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
label.f .field{color:var(--ink)}
fieldset{border:none;margin:0;padding:0}
legend{font-size:12.5px;color:var(--muted);padding:0;margin-bottom:6px}
.wrap{display:flex;flex-wrap:wrap;gap:6px}
.check{display:flex;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--soft)}
.check:last-child{border-bottom:none}
.check input[type=checkbox]{width:22px;height:22px;margin:0;flex:none}
.check .lbl{flex:1;font-size:14.5px}
.check.done .lbl{text-decoration:line-through;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:36px;height:36px;border-radius:10px;border:1px solid var(--field);background:var(--surface);font-size:18px;cursor:pointer}
.stepper output{min-width:56px;text-align:center;font-weight:600}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--soft);width:100%;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left;cursor:pointer}
.item:first-of-type{border-top:none}
.when{width:58px;flex:none;display:flex;flex-direction:column;align-items:center;line-height:1.25}
.when .d{font-size:11px;color:var(--muted)}
.when .t{font-size:14px;font-weight:600}
.bar{width:4px;align-self:stretch;border-radius:2px;flex:none}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.title{font-size:14.5px;font-weight:500;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted)}
.banner{border-radius:16px;padding:12px 14px;display:flex;gap:10px;align-items:flex-start;margin-bottom:10px;font-size:14px}
.banner.appt{background:var(--appt-t);color:var(--appt-i)}
.banner.info{background:var(--soft);color:var(--ink)}
.banner.life{background:var(--life-t);color:var(--life-i)}
.shift{border-radius:16px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;background:var(--work);color:#fff}
:root[data-theme="dark"] .shift{color:#12151E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .shift{color:#12151E}}
.shift .big{font-family:'Kanit',sans-serif;font-weight:500;font-size:20px}
.empty{font-size:13.5px;color:var(--muted);padding:6px 0}
.seg{display:grid;gap:4px;padding:4px;border-radius:12px;background:var(--soft)}
.seg button{min-height:36px;border-radius:9px;border:none;background:transparent;cursor:pointer;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tabs button{min-height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--field);background:var(--surface);cursor:pointer;font-size:13px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal .h{text-align:center;font-size:11.5px;color:var(--muted)}
.cal button{height:48px;border:none;border-radius:10px;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--primary)}
.cal button[aria-pressed="true"]{background:var(--primary);color:#fff;font-weight:600}
:root[data-theme="dark"] .cal button[aria-pressed="true"]{color:#12151E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .cal button[aria-pressed="true"]{color:#12151E}}
.cal .dots{display:flex;gap:2px;height:5px}
.cal .dots span{width:6px;height:6px;border-radius:3px}
.year{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.year button{min-height:72px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.list{background:var(--surface);border-radius:16px;overflow:hidden;margin-bottom:14px}
.list > *{border-top:1px solid var(--soft)}
.list > *:first-child{border-top:none}
.lrow{display:flex;align-items:center;gap:10px;min-height:50px;padding:6px 14px}
.lrow .grow{gap:0}
.group-t{margin:0 4px 6px;font-size:12.5px;font-weight:600;color:var(--muted)}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabbar .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding:6px 2px}
nav.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:52px;margin:0 2px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:11px}
nav.tabbar a[aria-current="page"]{background:var(--primary-tint);color:var(--primary-ink);font-weight:600}
.fab{position:fixed;right:max(18px,calc(50% - 242px));bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:19;width:58px;height:58px;border-radius:18px;border:none;background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(36,72,184,.35);cursor:pointer;display:flex;align-items:center;justify-content:center}
:root[data-theme="dark"] .fab{color:#12151E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .fab{color:#12151E}}
.fab[hidden]{display:none}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;max-height:92vh;overflow-y:auto;background:var(--surface);border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-width:560px;margin:0 auto;box-shadow:0 -8px 24px rgba(0,0,0,.2)}
.sheet .handle{width:40px;height:5px;border-radius:3px;background:var(--field);align-self:center}
.sheet h2{font-family:'Kanit',sans-serif;font-weight:500;font-size:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:90vw}
.toast.bad{background:var(--life);color:#fff}
.guide ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.guide li{display:flex;gap:12px;align-items:flex-start}
.num{width:28px;height:28px;border-radius:14px;background:var(--primary);color:#fff;font-weight:600;display:flex;align-items:center;justify-content:center;flex:none;font-size:14px}
:root[data-theme="dark"] .num{color:#12151E}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .num{color:#12151E}}
table.map{border-collapse:collapse;width:100%}
table.map th,table.map td{padding:6px 0;border-top:1px solid var(--soft);font-size:13.5px;vertical-align:top}
table.map th{text-align:left;font-weight:500;padding-right:8px}
table.map td{text-align:right;color:var(--primary-ink);font-weight:500}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion: no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
:root{--gcal:#2B7A85;--gcal-t:#E0F1F3;--gcal-i:#1D5A62}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--gcal:#6CC4CF;--gcal-t:#173438;--gcal-i:#A9E1E7}}
:root[data-theme="dark"]{--gcal:#6CC4CF;--gcal-t:#173438;--gcal-i:#A9E1E7}
:root[data-skin="angel"]{--surface:rgba(255,255,255,.88);--bg:#C9C6F2}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--bg)}
:root[data-skin="angel"] body::before{background:var(--page-bg)}
:root[data-skin="angel"] .card,:root[data-skin="angel"] .list,:root[data-skin="angel"] nav.tabbar{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
:root[data-skin="angel"] header.top{background:rgba(255,255,255,.72);border-radius:16px;padding:12px 14px;margin:12px 0 10px;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
:root[data-skin="angel"] .group-t{display:inline-block;background:rgba(255,255,255,.8);padding:2px 10px;border-radius:999px}
body{background:transparent}
.sub-items{margin:0 0 6px 32px;display:flex;flex-direction:column}
.sub-items label{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px}
.sub-items input{width:20px;height:20px;margin:0}
.sub-items label.done span{text-decoration:line-through;color:var(--muted)}
.hours{max-height:380px;overflow-y:auto;border-radius:12px;border:1px solid var(--soft)}
.hr{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-top:1px solid var(--soft)}
.hr:first-child{border-top:none}
.hr.now{background:var(--primary-tint)}
.hr .h{width:44px;flex:none;font-size:13px;font-weight:600;padding-top:8px;color:var(--muted)}
.hr.now .h{color:var(--primary-ink)}
.hr .c{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.hr input{min-height:36px;border-radius:8px;border:1px solid transparent;background:transparent;padding:0 8px;font-size:14px;width:100%}
.hr input:hover,.hr input:focus{border-color:var(--field);background:var(--surface)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;padding:1px 8px;border-radius:999px;align-self:flex-start;font-weight:500}
.cases{display:flex;flex-direction:column;margin:0 0 6px 32px}
.case{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px dashed var(--soft)}
.case .tm{font-size:12.5px;color:var(--muted);width:92px;flex:none}
.swatch{width:40px;height:40px;border-radius:20px;border:3px solid transparent;cursor:pointer}
.swatch[aria-pressed="true"]{border-color:var(--ink)}
.pay td,.pay th{padding:6px 0;border-top:1px solid var(--soft);font-size:14px;text-align:right}
.pay th{text-align:left;font-weight:500}
.pay tr.total td,.pay tr.total th{font-weight:600;border-top:2px solid var(--line)}
.preview{max-height:300px;overflow-y:auto;border:1px solid var(--soft);border-radius:12px}
.preview label{display:flex;gap:10px;align-items:center;min-height:42px;padding:0 10px;border-top:1px solid var(--soft);font-size:14px}
.preview label:first-child{border-top:none}
details.rt{border-bottom:1px solid var(--soft)}
details.rt > summary{list-style:none;cursor:pointer;border-bottom:none}
details.rt > summary::-webkit-details-marker{display:none}
details.rt .chev{transition:transform .15s;color:var(--muted)}
details.rt[open] .chev{transform:rotate(180deg)}
.th{font-weight:600;font-size:13px;color:var(--primary-ink);padding:12px 0 4px}
.ti{padding:8px 0;border-top:1px dashed var(--soft);display:flex;flex-direction:column;gap:6px;font-size:14px}
.ti .done-t{color:var(--muted)}
.ti-c{display:flex;align-items:center;gap:10px;min-height:40px;font-size:14px}
.ti-c input{width:20px;height:20px;margin:0}
.ti-c.done span{text-decoration:line-through;color:var(--muted)}
.sub-items input.field{width:100%;height:auto;min-height:38px}
.tri{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
.tri button{min-height:36px;border-radius:9px;border:1px solid var(--field);background:var(--surface);font-size:13px;cursor:pointer;color:var(--ink)}
.tri button.t-do[aria-pressed="true"]{background:var(--money-t);color:var(--money-i);border-color:var(--money);font-weight:600}
.tri button.t-didnt[aria-pressed="true"]{background:var(--life-t);color:var(--life-i);border-color:var(--life);font-weight:600}
.tri button.t-na[aria-pressed="true"]{background:var(--soft);border-color:var(--muted);font-weight:600}
/* ---------- pastel angel theme (v0.4) ---------- */
:root[data-skin="angel"]{
  --bg:#C9C2F4; --surface:rgba(255,255,255,.86); --ink:#3B2F63; --muted:#6B5F8E; --line:#E6DCF7; --soft:#F1EBFB; --field:#D9CCF1;
  --work:#6E56CF; --work-t:#ECE6FF; --work-i:#4A3796;
  --appt:#C2508A; --appt-t:#FCE4F0; --appt-i:#8E2E62;
  --money:#2E8A6A; --money-t:#DFF5EC; --money-i:#1D6049;
  --proj:#8458C9; --proj-t:#F0E7FC; --proj-i:#5E3A99;
  --life:#D0567F; --life-t:#FDE6EE; --life-i:#9A2E52;
  --gcal:#3C8DB0; --gcal-t:#E1F1F9; --gcal-i:#23607D;
  --scrim:rgba(59,47,99,.4);
}
:root[data-skin="angel"] h1,:root[data-skin="angel"] .sheet h2,:root[data-skin="angel"] .shift .big{font-family:'Mali','Kanit',sans-serif;font-weight:600}
:root[data-skin="angel"] .card,:root[data-skin="angel"] .list{border-radius:22px;border:1px solid rgba(255,255,255,.95);box-shadow:0 6px 18px rgba(110,86,207,.12)}
:root[data-skin="angel"] .shift{background:linear-gradient(135deg,#6E56CF,#B5468A);border-radius:22px;box-shadow:0 8px 20px rgba(110,86,207,.25)}
:root[data-skin="angel"] .shift.off{background:linear-gradient(135deg,#F7C9DD,#D9CCFA);color:var(--ink)}
:root[data-skin="angel"] nav.tabbar{background:rgba(255,255,255,.92);border-top:none;border-radius:24px 24px 0 0;box-shadow:0 -6px 20px rgba(110,86,207,.15)}
:root[data-skin="angel"] nav.tabbar a{color:var(--muted)}
:root[data-skin="angel"] nav.tabbar a[aria-current="page"]{background:linear-gradient(135deg,#FBE0EE,#E8DEFC);color:var(--ink)}
:root[data-skin="angel"] .fab{background:linear-gradient(135deg,#8A6BE0,#D35C97);color:#fff;border-radius:22px;box-shadow:0 8px 20px rgba(181,70,138,.35)}
:root[data-skin="angel"] .btn{border-radius:14px}
:root[data-skin="angel"] .sheet{background:#FFFFFF}
:root[data-skin="angel"] .btn.primary{background:linear-gradient(135deg,#7A4CC2,#B5468A);border:none;color:#fff}
:root[data-skin="angel"] .chip{border-radius:999px}
:root[data-skin="angel"] .banner.appt{background:#FCE4F0;color:#8E2E62}
:root[data-skin="angel"] .banner.info{background:#E9F3FC;color:#23607D}
nav.tabbar a svg{width:26px;height:26px}
.shift.off{background:var(--soft);color:var(--ink)}
.chk-grid{display:grid;grid-template-columns:minmax(0,1fr) 44px 52px 40px;align-items:center;column-gap:4px}
.chk-grid .hd{font-size:11.5px;font-weight:600;color:var(--muted);text-align:center;padding:6px 0;border-bottom:2px solid var(--line)}
.chk-grid .hd:first-child{text-align:left}

/* cute checkboxes */
:root:not([data-check="plain"]) input[type=checkbox]{-webkit-appearance:none;appearance:none;width:24px;height:24px;flex:none;margin:0;border-radius:8px;border:2px solid color-mix(in srgb,var(--primary) 55%,#fff);background:var(--surface-solid,#fff);cursor:pointer;display:inline-grid;place-content:center;transition:transform .1s}
:root:not([data-check="plain"]) input[type=checkbox]:checked{background:var(--primary);border-color:var(--primary)}
:root:not([data-check="plain"]) input[type=checkbox]:checked::after{content:"";width:15px;height:15px;background:#fff;-webkit-mask:var(--ck) center/contain no-repeat;mask:var(--ck) center/contain no-repeat}
:root:not([data-check="plain"]) input[type=checkbox]:active{transform:scale(.9)}
:root:not([data-check="plain"]) input[type=checkbox][role="switch"]{width:44px;height:26px;border-radius:13px;justify-content:start;place-content:center start;padding:2px}
:root:not([data-check="plain"]) input[type=checkbox][role="switch"]::before{content:"";width:18px;height:18px;border-radius:9px;background:color-mix(in srgb,var(--primary) 45%,#fff);transition:transform .15s}
:root:not([data-check="plain"]) input[type=checkbox][role="switch"]:checked::before{transform:translateX(18px);background:#fff}

const IS_INSTALLED = window.matchMedia && window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const IS_IOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (typeof render === 'function') try{ render(); }catch(err){} });
let relInstalled = false;
if (STANDALONE && !IS_INSTALLED && navigator.getInstalledRelatedApps) navigator.getInstalledRelatedApps().then(a => { if (a && a.length){ relInstalled = true; try{ render(); }catch(err){} } }).catch(() => {});

if (STANDALONE){

  const downloads = {save: async ({filename, data, mimeType}) => {
    const blob = data instanceof Blob ? data : new Blob([data], {type: mimeType || mime(filename)});
    const url = URL.createObjectURL(blob); const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000); return {};
  }};
  window.claude = {use: async name => name === 'downloads' ? downloads : null};
  { const fi = document.createElement('link'); fi.rel = 'icon'; fi.href = APP_ICON; document.head.appendChild(fi); }
  window.addEventListener('load', () => {
    if (!document.querySelector('link[rel=manifest]')){ const l = document.createElement('link'); l.rel = 'manifest'; l.href = 'manifest.json'; document.head.appendChild(l); }
    const ai = document.createElement('link'); ai.rel = 'apple-touch-icon'; ai.href = 'apple-touch-icon.png'; document.head.appendChild(ai);
    const m = document.createElement('meta'); m.name = 'theme-color'; m.content = '#7A4CC2'; document.head.appendChild(m);
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js', {updateViaCache:'none'}).catch(() => {});
  });
}

  const cut = addDays(t, -keep), cutShift = addDays(t, -400);

  Object.keys(S.shifts).forEach(d => { if (d < cutShift){ delete S.shifts[d]; n++; } });

const storeKB = () => { try{ return Math.round((localStorage.getItem(LS_STATE) || '').length * 2 / 1024); }catch(e){ return 0; } };
const shiftsOn = d => { const s = S.shifts[d]; return s ? (s.types || (s.type ? [s.type] : [])) : []; };
const toMin = hm => { if (!hm) return null; const [h,m] = hm.split(':').map(Number); return h*60 + (m||0); };

    const dur = c.start && c.end ? caseMins(c) : (Number(c.mins) || 0);

function dotsFor(d){
  const out = shiftsOn(d).map(k => SHIFT_DOT[k] || 'var(--work)');
  const ks = new Set();
  S.appts.forEach(a => { if (a.date === d) ks.add(a.sys || 'appt'); });
  if ((S.cases[d] || []).length) ks.add('work');
  if ((GCal.forDay(d) || []).length) ks.add('gcal');
  ['work','appt','money','proj','life','gcal'].filter(k => ks.has(k)).forEach(k => out.push(sysVar(k)));
  return out.slice(0, 5);
}
function payFor(ym){
  const counts = {};
  Object.keys(S.shifts).forEach(d => { if (d.startsWith(ym)) shiftsOn(d).forEach(k => { counts[k] = (counts[k]||0) + 1; }); });
  const rows = Object.keys(S.shiftTypes).filter(k => counts[k]).map(k => {
    const rate = Number(S.shiftTypes[k].rate);
    const free = k === 'OFF' || String(S.shiftTypes[k].rate) === '0';
    return {k, n:counts[k], rate: rate > 0 ? rate : (free ? 0 : null), sum: rate > 0 ? rate * counts[k] : (free ? 0 : null)};
  });
  const missing = rows.some(r => r.rate == null);
  const total = rows.reduce((a, r) => a + (r.sum || 0), 0);
  return {rows, missing, total, n: rows.filter(r => r.k !== 'OFF').reduce((a, r) => a + r.n, 0)};
}

  return `<div class="lrow" style="flex-direction:column;align-items:stretch;padding:12px 14px;gap:10px">
      <span><span style="display:block;font-weight:600">เด้งเตือนบนมือถือ</span><span class="meta">เวอร์ชันนี้มี 3 ทาง ใช้คู่กันได้</span></span>
      <div class="row" style="gap:10px;align-items:flex-start"><span style="font-size:22px">🔔</span><span class="grow"><b style="font-size:14px">แจ้งเตือนของแอป</b><span class="meta" style="display:block">${notiOn ? 'เปิดอยู่ · เด้งนัดของวันนี้เมื่อเปิดแอป' : 'เด้งนัดของวันนี้ในแถบแจ้งเตือน เมื่อเปิดแอป'}</span></span>${notiOn ? '' : '<button type="button" class="btn small primary" data-act="noti-on">เปิด</button>'}</div>
      <div class="row" style="gap:10px;align-items:flex-start"><span style="font-size:22px">📅</span><span class="grow"><b style="font-size:14px">ไฟล์ปฏิทิน (.ics)</b><span class="meta" style="display:block">ลงนัดในปฏิทินของเครื่อง เตือนตรงเวลาแม้ปิดแอป</span></span><button type="button" class="btn small primary" data-act="ics">ดาวน์โหลด</button></div>
      <div class="row" style="gap:10px;align-items:flex-start"><span style="font-size:22px">💬</span><span class="grow"><b style="font-size:14px">ให้ Claude ตั้งเตือน</b><span class="meta" style="display:block">คัดลอกรายการนัดไปวางในแชตกับ Claude</span></span><button type="button" class="btn small" data-act="claude-remind">คัดลอก</button></div>
      <div class="row" style="gap:10px;align-items:flex-start;border-top:1px solid var(--soft);padding-top:10px"><span style="font-size:22px">🚀</span><span class="grow"><b style="font-size:14px">แจ้งเตือนจริงแม้ปิดแอป (Push)</b><span class="meta" style="display:block">เด้งตรงเวลาจากแอปเลขาส่วนตัวเอง ต้องตั้งเซิร์ฟเวอร์ฟรีครั้งเดียว</span></span><button type="button" class="btn small" data-act="push-setup">วิธีตั้ง</button></div>
      ${WPush.cfg().on ? `<div class="row" style="flex-wrap:wrap;gap:6px"><span class="meta" style="width:100%">${esc(WPush.status || 'เชื่อมอยู่ · ' + WPush.cfg().url)}</span><button type="button" class="btn small primary" data-act="wpush-test">ทดสอบเด้ง</button><button type="button" class="btn small" data-act="wpush-sync">ซิงก์การเตือน</button><button type="button" class="btn small ghost" data-act="wpush-off">ปิด</button></div>
        <details><summary class="meta" style="cursor:pointer">รหัสเจ้าของ (ใช้เชื่อมเครื่องอื่น)</summary><code style="font-size:12px;word-break:break-all">${esc(WPush.cfg().key || '')}</code></details>`
      : `<form data-form="wpush" class="row" style="flex-wrap:wrap;gap:6px"><input class="field" name="url" type="url" placeholder="https://secretary-push.ชื่อ.workers.dev" value="${esc(WPush.cfg().url || '')}" style="flex:1 1 100%"><input class="field" name="key" placeholder="รหัสเจ้าของ (เว้นว่างถ้าเป็นเครื่องแรก)" value="${esc(WPush.cfg().key || '')}" style="flex:1 1 100%"><button class="btn small primary" type="submit">เชื่อมต่อ</button>${WPush.status ? `<span class="meta" style="width:100%">${esc(WPush.status)}</span>` : ''}</form>`}
      <p class="meta" style="margin:0">ส่งนัดไป Google Calendar อัตโนมัติได้เฉพาะตอนเปิดแอปผ่าน claude.ai</p>
    </div>`;
}
function claudeRemindHtml(st){
  return `    <label class="lrow"><span class="grow"><span style="font-weight:600">เด้งเตือนบนมือถือจริง</span><span class="meta">ส่งนัดไป Google Calendar พร้อมการเตือน มือถือจะเด้งผ่านแอป Google Calendar</span></span><input type="checkbox" role="switch" data-act="push"${st.push ? ' checked' : ''}></label>
    <div class="lrow" style="flex-wrap:wrap;padding:10px 14px;gap:8px"><span class="meta grow" style="min-width:100%">${esc(Push.status())}</span>
      ${st.push ? '<button type="button" class="btn small" data-act="push-test">ทดสอบการเชื่อมต่อ</button><button type="button" class="btn small primary" data-act="push-all">ส่งนัดที่จะถึงทั้งหมด</button>' : ''}
      <button type="button" class="btn small" data-act="claude-remind">ให้ Claude ตั้งเตือนแทน</button>`;
}

      <label class="row" style="flex:1 1 100%;gap:8px;font-size:13px;color:var(--muted)">ชั่วโมงที่นับเป็นเวลาทำงาน<input class="field" type="number" inputmode="decimal" min="0" step="0.5" name="${esc(k)}-hours" value="${esc(S.shiftTypes[k].hours != null ? S.shiftTypes[k].hours : '')}" style="flex:1;min-width:0"></label></div>`).join('')}

    <label class="row" style="gap:10px;min-height:44px;cursor:pointer"><input type="checkbox" name="nightOn"${R.nightOn !== false ? ' checked' : ''}><span style="font-weight:600">ค่ายามวิกาล ${esc(R.nightFrom)}–${esc(R.nightTo)} น. +${esc(R.night)} บาท</span></label>

  <div class="list"><div class="lrow" style="flex-wrap:wrap;padding:10px 14px;gap:8px">

  </form>`);
}

/* ---------- Thai holidays (public data, built in) + Gmail calendar (read-only) ---------- */
const GCal = (function(){
  const cache = {}, loading = {};
  let mcp = null, booted = false, status = '', lastCode = '';
  const on = () => S.settings.gcal.holiday || S.settings.gcal.primary;
  const errText = code => ({
    unavailable: STANDALONE ? 'เวอร์ชัน GitHub เชื่อมปฏิทิน Gmail ไม่ได้ (วันหยุดบริษัทยังขึ้นตามปกติ)' : 'หน้านี้เชื่อมปฏิทิน Gmail ไม่ได้ ลองเปิดลิงก์แอปใน Chrome ที่ล็อกอิน claude.ai ไว้',
    server_not_connected:'บัญชี Claude นี้ยังไม่ได้เชื่อม Google Calendar: เปิด claude.ai › ตั้งค่า › Connectors แล้วเพิ่ม Google Calendar',
    needs_reauth:'การเชื่อม Google Calendar หมดอายุ: เชื่อมใหม่ที่ claude.ai › ตั้งค่า › Connectors',
    approval_required:'ต้องอนุญาตให้แอปอ่านปฏิทินก่อน กด “ทดสอบการเชื่อมต่อ” แล้วกดอนุญาต',
    not_granted:'ยังไม่ได้อนุญาตให้อ่านปฏิทิน กด “ทดสอบการเชื่อมต่อ” แล้วกดอนุญาต',
    consent_required:'ยังไม่ได้อนุญาตให้อ่านปฏิทิน กด “ทดสอบการเชื่อมต่อ” แล้วกดอนุญาต',
    not_in_manifest:'แอปเวอร์ชันนี้ยังไม่ได้รับสิทธิ์อ่านปฏิทิน ลองปิดแล้วเปิดแอปใหม่',
    blocked_by_policy:'องค์กรของบัญชีนี้ปิดการใช้ Google Calendar กับ Claude',
    server_unavailable:'Google Calendar ไม่ตอบชั่วคราว ลองใหม่อีกครั้ง',
    upstream_error:'Google Calendar ไม่ตอบชั่วคราว ลองใหม่อีกครั้ง'
  })[code] || ('อ่าน Google Calendar ไม่สำเร็จ' + (code ? ' (รหัส ' + code + ')' : ''));
  async function boot(){
    if (booted) return mcp; booted = true;
    try{ mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null; }catch(e){ mcp = null; }
    if (!mcp){ lastCode = 'unavailable'; status = errText('unavailable'); }
    return mcp;
  }
  function nextMonth(ym){ const [y,m] = ym.split('-').map(Number); return ymd(new Date(y, m, 1)).slice(0,7); }
  async function fetchPrimary(ym){
    const res = await mcp.callTool('Google Calendar', 'list_events', {startTime: ym + '-01T00:00:00', endTime: nextMonth(ym) + '-01T00:00:00', orderBy:'startTime', pageSize:250});
    const p = res && res.payload ? res.payload : {};
    return (p.events || []).filter(e => e.status !== 'cancelled').map(e => {
      const st = e.start || {}; const raw = st.date || st.dateTime || '';
      return {date: raw.slice(0,10), time: st.date ? '' : raw.slice(11,16), title: String(e.summary || '(ไม่มีชื่อ)').replace(/\u200b/g,''), src:'primary'};
    });
  }
  async function load(ym){
    if (!S.settings.gcal.primary || loading[ym] || cache[ym]) return;
    loading[ym] = true;
    if (!(await boot())){ loading[ym] = false; cache['err:' + ym] = status; cache['tried:' + ym] = true; render(); return; }
    try{
      cache[ym] = await fetchPrimary(ym); delete cache['err:' + ym]; lastCode = '';
      status = 'อ่านปฏิทิน Gmail ล่าสุด ' + new Date().toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
    }catch(e){ lastCode = e && e.code || ''; status = errText(lastCode); cache['err:' + ym] = status; cache['tried:' + ym] = true; }
    loading[ym] = false; render();
  }
  return {
    on,
    ensure(ym){ if (S.settings.gcal.primary && !cache[ym] && !cache['tried:' + ym]) load(ym); },
    forDay(d){
      const out = [];
      (S.coHol || []).forEach(h => { if (h[0] === d && h[2]) out.push({date:d, time:'', title:h[1] + ' (หยุดบริษัท)', src:'holiday', off:true}); });
      if (S.settings.gcal.holiday) HOLIDAYS.forEach(h => { if (h[0] === d && !h[2]) out.push({date:d, time:'', title:h[1], src:'holiday', off:false}); });
      const c = cache[d.slice(0,7)]; if (c) c.forEach(e => { if (e.date === d) out.push(e); });
      return out;
    },
    note(ym){
      if (!S.settings.gcal.primary) return '';
      if (loading[ym]) return '<p class="meta" style="margin:0">กำลังอ่านปฏิทิน Gmail…</p>';
      if (cache['err:' + ym]) return `<div class="row" style="gap:8px;flex-wrap:wrap"><span class="meta" style="flex:1;color:var(--life-i)">${esc(cache['err:' + ym])}</span><button type="button" class="btn small" data-act="gcal-retry" data-m="${ym}">ลองใหม่</button></div>`;
      return '';
    },
    retry(ym){ delete cache[ym]; delete cache['tried:' + ym]; delete cache['err:' + ym]; load(ym); render(); },
    clear(){ Object.keys(cache).forEach(k => delete cache[k]); },
    async test(){
      status = 'กำลังทดสอบ…'; render();
      const p = window.claude && window.claude.use ? await window.claude.use('permissions').catch(() => null) : null;
      if (p) await p.request(['mcp:Google Calendar']).catch(() => null);
      booted = false;
      if (!(await boot())){ render(); return; }
      try{
        const lt = await mcp.listTools().catch(() => null);
        const srv = lt && (lt.servers || []).find(s => /google calendar/i.test(s.name || s.server || s.displayName || ''));
        if (lt && !srv){ lastCode = 'server_not_connected'; status = errText(lastCode); render(); return; }
        const ym = today().slice(0,7);
        cache[ym] = await fetchPrimary(ym); delete cache['err:' + ym]; delete cache['tried:' + ym]; lastCode = '';
        status = 'เชื่อมต่อสำเร็จ อ่านได้ ' + cache[ym].length + ' รายการในเดือนนี้';
      }catch(e){ lastCode = e && e.code || ''; status = errText(lastCode); }
      render();
    },
    statusText(){ return S.settings.gcal.primary ? (status || 'เปิดหน้าตารางเพื่อดึงข้อมูล หรือกดทดสอบ') : 'ปิดอยู่ แอปจะไม่อ่านปฏิทิน Gmail ของคุณ'; }
  };
})();

/* ---------- roster: whole-month entry (always works) + read from photo (when available) ---------- */
const COMBOS = [['8-16'],['STD'],['STDM'],['8-00'],['OFF']];
const comboLabel = c => c.join('+') === '8-16+STD' ? '8-16<br>+STD' : c[0] === 'STDM' ? '+STD<br>เช้า' : codeName(c[0]);
const comboKey = c => c.slice().sort().join('+');
const Roster = (function(){
  let result = null, pending = {}, tab = 'month', ym = null;
  function monthRows(){
    const [y,m] = ym.split('-').map(Number); const days = new Date(y, m, 0).getDate();
    let rows = '';
    for (let d = 1; d <= days; d++){
      const ds = `${y}-${pad(m)}-${pad(d)}`;
      const cur = pending[ds] !== undefined ? pending[ds] : shiftsOn(ds);
      const ck = comboKey(cur || []);
      const hol = HOLIDAYS.find(h => h[0] === ds && h[2]);
      rows += `<div class="mrow"><span class="md"${hol ? ' style="color:var(--life-i)"' : ''}>${esc(parse(ds).toLocaleDateString('th-TH',{weekday:'short'}))} ${d}</span><div class="mopts">${COMBOS.map((c, i) => `<button type="button" data-act="m-pick" data-d="${ds}" data-i="${i}" aria-pressed="${(cur || []).includes(c[0])}" class="t-${c[0]}">${comboLabel(c)}</button>`).join('')}</div></div>`;
    }
    return rows;
  }
  function draw(){
    const sh = document.querySelector('#layer .sheet'); if (!sh) return;
    const [y,m] = ym.split('-').map(Number);
    const body = sh.querySelector('#rs-body');
    sh.querySelectorAll('[data-act=rs-tab]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.k === tab)));
    if (tab === 'month'){
      const n = Object.keys(pending).length;
      body.innerHTML = `<div class="row between"><button type="button" class="btn small" data-act="rs-mon" data-d="-1" aria-label="เดือนก่อน">‹</button><strong>${esc(new Date(y, m-1, 1).toLocaleDateString('th-TH',{month:'long', year:'numeric'}))}</strong><button type="button" class="btn small" data-act="rs-mon" data-d="1" aria-label="เดือนถัดไป">›</button></div>
        <p class="meta" style="margin:0">แตะได้วันละ 2 ช่อง แตะซ้ำเพื่อเอาออก · ช่องเหลืองที่เขียน 8-16 = แตะ 8-16 และ STD · วันหยุดที่มี STD 24 ชม. + STD เช้า = แตะ +STD เช้า (แอปติ๊ก STD ให้ด้วย รวม 300 บาท)</p>
        <div class="mgrid">${monthRows()}</div>
        <button type="button" class="btn primary" data-act="rs-save"${n ? '' : ' disabled'}>บันทึกตารางเวร${n ? ' (' + n + ' วันที่เปลี่ยน)' : ''}</button>`;
    } else if (tab === 'file'){
      body.innerHTML = `<form data-form="rfile" style="display:flex;flex-direction:column;gap:12px">
        <p class="meta" style="margin:0">ใช้ไฟล์ตารางเวรที่แผนกส่งมา (.html หรือ .xlsx) แอปอ่านในเครื่อง ไม่ส่งไฟล์ไปที่ไหน</p>
        <label class="f">ไฟล์ตารางเวร<input class="field" type="file" name="file" accept=".html,.htm,.xhtml,.xlsx,.xls" required style="padding:8px"></label>
        <label class="f">รหัสพนักงาน หรือ ชื่อของคุณ<input class="field" name="who" required value="${esc(S.settings.profile.id || S.settings.rosterName)}"></label>
        <label class="f">เดือน (ใช้เมื่อไฟล์ไม่ได้บอกเดือน)<input class="field" type="month" name="ym" value="${esc(ym)}"></label>
        <button class="btn primary" type="submit">อ่านไฟล์</button><div id="rf-out" aria-live="polite"></div></form>`;
    } else {
      body.innerHTML = '<p class="meta">กำลังตรวจว่าส่งรูปให้ Claude อ่านได้ไหม…</p>';
      photoForm(body);
    }
  }
  async function photoForm(body){
    let sample = null;
    try{ sample = window.claude && window.claude.use ? await window.claude.use('sample') : null; }catch(e){}
    const lim = sample ? await sample.limits().catch(() => null) : null;
    if (tab !== 'photo') return;
    if (!sample){ body.innerHTML = '<p style="margin:0">หน้านี้ส่งรูปให้ Claude อ่านไม่ได้ ใช้แท็บ “ลงทั้งเดือน” แทนได้เลย ใช้เวลาไม่ถึงนาที</p>'; return; }
    const types = lim && lim.images && lim.images.mediaTypes ? lim.images.mediaTypes.join(',') : 'image/jpeg,image/png,image/webp';
    body.innerHTML = `<form data-form="roster" style="display:flex;flex-direction:column;gap:12px">
      <label class="f">รูปตารางเวร<input class="field" type="file" name="img" accept="${esc(types)}" required style="padding:8px"></label>
      <label class="f">ชื่อ และ/หรือ รหัสพนักงานของคุณในตาราง<input class="field" name="who" required value="${esc(S.settings.rosterName)}"></label>
      <label class="f">เดือนของตาราง<input class="field" type="month" name="ym" required value="${esc(ym)}"></label>
      <label class="f">วิธีอ่านสีและรหัส<textarea class="field" name="codes" rows="3">${esc(S.settings.rosterCodes)}</textarea></label>
      <p class="meta" style="margin:0">รูปจะถูกส่งให้ Claude อ่าน ครอปให้เหลือหัวตารางกับแถวของคุณก่อน${lim && lim.images ? '' : ' · ครั้งแรกจะมีหน้าต่างขออนุญาตส่งรูป'}</p>
      <button class="btn primary" type="submit" id="rs-go">อ่านตาราง</button><div id="rs-out" aria-live="polite"></div></form>`;
  }
  function open(){
    ym = calMonth; pending = {}; result = null; tab = 'month';
    openSheet(`${sheetHead('ลงตารางเวร')}
      <div class="seg" style="grid-template-columns:repeat(3,minmax(0,1fr))" role="group"><button type="button" data-act="rs-tab" data-k="month" aria-pressed="true">ลงทั้งเดือน</button><button type="button" data-act="rs-tab" data-k="file" aria-pressed="false">จากไฟล์</button><button type="button" data-act="rs-tab" data-k="photo" aria-pressed="false">จากรูป</button></div>
      <div id="rs-body" style="display:flex;flex-direction:column;gap:10px"></div>`);
    draw();
  }
  function pick(d, i){
    const k = COMBOS[i][0]; let cur = (pending[d] !== undefined ? pending[d] : shiftsOn(d)).slice();
    if (cur.includes(k)){ cur = cur.filter(x => x !== k); if (k === 'STD') cur = cur.filter(x => x !== 'STDM'); }
    else if (k === 'STDM'){
      if (cur.some(x => x === '8-16' || x === '8-00')){ toast('STD เช้า (+100) ใช้ได้เฉพาะวันหยุดที่มี STD 24 ชม.', true); return; }
      if (!cur.includes('STD')){ if (cur.filter(x => x !== 'STDM').length >= 2){ toast('ติ๊กได้สูงสุด 2 ช่องต่อวัน แตะช่องเดิมเพื่อเอาออกก่อน', true); return; } cur.push('STD'); }
      cur.push('STDM');
    }
    else { if (cur.filter(x => x !== 'STDM').length >= 2){ toast('ติ๊กได้สูงสุด 2 ช่องต่อวัน แตะช่องเดิมเพื่อเอาออกก่อน', true); return; } cur.push(k); }
    pending[d] = cur;
    const was = shiftsOn(d);
    if (comboKey(was) === comboKey(pending[d])) delete pending[d];
    draw();
  }
  function saveMonth(){
    const ks = Object.keys(pending); if (!ks.length) return;
    ks.forEach(d => { if (pending[d].length) S.shifts[d] = {types:pending[d]}; else delete S.shifts[d]; });
    pending = {}; closeSheet();
    commit('ลงตารางเวรทั้งเดือน ' + ks.length + ' วัน', {msg:'บันทึกตารางเวรแล้ว ' + ks.length + ' วัน'});
  }
  async function read(f){
    const fd = new FormData(f);
    const file = fd.get('img'); const who = String(fd.get('who') || '').trim();
    const ymv = String(fd.get('ym') || ''); const codes = String(fd.get('codes') || '').trim();
    if (!file || !file.size || !who || !/^\d{4}-\d{2}$/.test(ymv)) return;
    S.settings.rosterName = who; S.settings.rosterCodes = codes; writeLocal();
    const out = f.querySelector('#rs-out'); const btn = f.querySelector('#rs-go');
    btn.disabled = true; out.innerHTML = '<p class="meta">Claude กำลังอ่านตาราง อาจใช้เวลาครึ่งนาที…</p>';
    let sample = null; try{ sample = await window.claude.use('sample'); }catch(e){}
    const [y,m] = ymv.split('-').map(Number); const days = new Date(y, m, 0).getDate();
    const types = Object.keys(S.shiftTypes).filter(k => k !== 'OFF');
    const prompt = `อ่านรูปตารางเวรพยาบาลของเดือน ${m}/${y} (ค.ศ.) ซึ่งมี ${days} วัน
หาแถวของคนชื่อหรือรหัส "${who}" เท่านั้น ห้ามใส่ข้อมูลหรือชื่อของคนอื่นในคำตอบ
วิธีอ่าน: ${codes}
ช่องที่เขียน 8-8 ให้ตอบเป็น "8-00" · ดูทั้งสีของช่องและข้อความ แปลงแต่ละวันเป็นประเภท ใช้ได้เฉพาะ: ${types.join(', ')} หรือ "หยุด" วันหนึ่งมีได้หลายประเภท เช่น ["8-16","STD"] ตัวเลขเล็ก ๆ ที่เขียนด้วยมือเพิ่มไม่ต้องสนใจ
วันที่อ่านไม่ชัดให้ข้าม แล้วเขียนไว้ใน notes
ตอบเป็น JSON อย่างเดียว: {"found": true, "shifts": [{"day": 1, "types": ["8-00"]}], "notes": "ภาษาไทยสั้น ๆ"}
ถ้าไม่พบแถวของ "${who}" ให้ตอบ {"found": false, "shifts": [], "notes": "เหตุผล"}`;
    try{
      if (!sample) throw {code:'unavailable'};
      const v = await sample.json(prompt, {images:[file], modelTier:'default'});
      const clean = [];
      (Array.isArray(v && v.shifts) ? v.shifts : []).forEach(x => {
        const d = Number(x && x.day); if (!(d >= 1 && d <= days)) return;
        let ts = Array.isArray(x.types) ? x.types : [];
        if (ts.includes('หยุด')) ts = ['OFF']; else ts = ts.filter(t => types.includes(t));
        if (ts.length) clean.push({date:`${y}-${pad(m)}-${pad(d)}`, types:ts});
      });
      result = clean;
      if (!v || v.found === false || !clean.length){
        out.innerHTML = `<div class="banner appt" style="margin:0"><div>ไม่พบเวรที่อ่านได้${v && v.notes ? ': ' + esc(v.notes) : ''} ลองครอปให้ชัดขึ้น หรือใช้แท็บ “ลงทั้งเดือน”</div></div>`;
      } else {
        out.innerHTML = `<p style="margin:0 0 6px"><strong>อ่านได้ ${clean.length} วัน</strong> ติ๊กออกวันที่ไม่ถูกต้อง แล้วกดลงเวร</p>
          ${v.notes ? `<p class="meta" style="margin:0 0 6px">หมายเหตุ: ${esc(v.notes)}</p>` : ''}
          <div class="preview">${clean.map((c, i) => { const old = shiftsOn(c.date); return `<label><input type="checkbox" data-i="${i}" checked style="width:20px;height:20px;margin:0"><span style="width:96px">${esc(thDate(c.date,{weekday:'short',day:'numeric',month:'short'}))}</span><span class="grow">${c.types.map(k => esc(typeLabel(k))).join(' + ')}${old.length ? `<span class="meta">เดิม: ${old.map(k => esc(typeLabel(k))).join(' + ')}</span>` : ''}</span></label>`; }).join('')}</div>
          <button type="button" class="btn primary" data-act="roster-apply" style="margin-top:10px;width:100%">ลงเวรที่เลือก</button>`;
      }
    }catch(e){
      const code = e && e.code;

/* ---------- roster file import (.html / .xlsx from the department) ---------- */
const TH_MON = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
function colorKind(c){
  if (!c) return 'none';
  let h = String(c).trim().toLowerCase().replace('#','');
  if (/^ff[0-9a-f]{6}$/.test(h)) h = h.slice(2);
  if (h.length === 3) h = h.split('').map(x => x + x).join('');
  if (!/^[0-9a-f]{6}$/.test(h)) return 'none';
  const r = parseInt(h.slice(0,2),16), g = parseInt(h.slice(2,4),16), b = parseInt(h.slice(4,6),16);
  if (r > 200 && g > 190 && b < 140) return 'yellow';
  if (b > 140 && r < 120) return 'blue';
  if (r > 190 && g < 110 && b < 110) return 'red';
  if (r > 235 && g > 235 && b > 235) return 'white';
  return 'none';
}
function codeToTypes(text, color){
  const t = String(text || '').replace(/\s+/g,'').toUpperCase();
  const k = colorKind(color);
  if (t === '8-00' || t === '8-8' || (k === 'blue' && /8/.test(t))) return ['8-00'];
  if (/^STD(เช้า|M|ช)$/.test(t)) return ['STDM'];
  if (t === 'STD') return ['STD'];
  if (t === '8-16') return k === 'yellow' ? ['8-16','STD'] : ['8-16'];
  if (t === 'X' || t === 'OFF' || k === 'red') return ['OFF'];
  if (/VAC|AL|ลาพัก/.test(t)) return ['VAC'];
  if (/SICK|ลาป่วย/.test(t)) return ['SICK'];
  return null;
}
const normName = s => String(s || '').replace(/[\s\u00a0]+/g,'').toLowerCase();
function whoMatch(rowText, who){
  const rt = normName(rowText);
  const parts = String(who || '').split(/[,/]+/).map(normName).filter(x => x.length >= 3);
  const ids = (String(who).match(/\d{4,}/g) || []);
  return ids.some(id => rt.includes(id)) || parts.some(p => rt.includes(p));
}
function findYm(text){
  const y = (text.match(/25\d\d/) || [])[0];
  let mi = -1; TH_MON.forEach((mn, i) => { if (mi < 0 && text.includes(mn)) mi = i; });
  if (mi < 0){ const full = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม']; full.forEach((mn, i) => { if (mi < 0 && text.includes(mn)) mi = i; }); }
  return y && mi >= 0 ? `${Number(y) - 543}-${pad(mi + 1)}` : null;
}
function cellsToShifts(cells, ym){
  const [y,m] = ym.split('-').map(Number); const days = new Date(y, m, 0).getDate();
  const start = cells.findIndex(c => codeToTypes(c.text, c.color));
  if (start < 0) return {list:[], skipped:days};
  const list = []; let skipped = 0;
  for (let i = 0; i < days; i++){
    const c = cells[start + i]; if (!c){ skipped++; continue; }
    const ts = codeToTypes(c.text, c.color);
    if (ts) list.push({date:`${ym}-${pad(i + 1)}`, types:ts}); else skipped++;
  }
  return {list, skipped};
}
function parseRosterHtml(text, who){
  const cls = {}; text.replace(/\.([\w-]+)\s*\{([^}]*)\}/g, (_, k, body) => { const m = body.match(/background(?:-color)?\s*:\s*([^;]+)/i); if (m) cls[k] = m[1].trim(); return ''; });
  const doc = new DOMParser().parseFromString(text, 'text/html');
  const ym = findYm(doc.body ? doc.body.textContent : text);
  const row = [...doc.querySelectorAll('tr')].find(tr => whoMatch(tr.textContent, who));
  if (!row) return {error:'ไม่พบชื่อหรือรหัส “' + who + '” ในไฟล์'};
  const cells = [...row.children].map(td => {
    let color = '';
    (td.getAttribute('class') || '').split(/\s+/).forEach(c => { if (cls[c]) color = cls[c]; });
    const st = (td.getAttribute('style') || '').match(/background(?:-color)?\s*:\s*([^;]+)/i); if (st) color = st[1];
    if (!color && td.getAttribute('bgcolor')) color = td.getAttribute('bgcolor');
    return {text: td.textContent.trim(), color};
  });
  return {ym, cells};
}
async function parseRosterXlsx(buf, who){
  await loadScript(XLSX_URL);
  const wb = window.XLSX.read(buf, {type:'array', cellStyles:true});
  for (const name of wb.SheetNames){
    const ws = wb.Sheets[name]; if (!ws['!ref']) continue;
    const range = window.XLSX.utils.decode_range(ws['!ref']);
    let headText = '';
    for (let r = range.s.r; r <= Math.min(range.e.r, range.s.r + 4); r++) for (let c = range.s.c; c <= range.e.c; c++){ const cell = ws[window.XLSX.utils.encode_cell({r, c})]; if (cell && cell.v != null) headText += ' ' + cell.v; }
    for (let r = range.s.r; r <= range.e.r; r++){
      let rowText = ''; const cells = [];
      for (let c = range.s.c; c <= range.e.c; c++){
        const cell = ws[window.XLSX.utils.encode_cell({r, c})];
        const v = cell && cell.v != null ? String(cell.v) : '';
        rowText += ' ' + v;
        const fg = cell && cell.s && (cell.s.fgColor || (cell.s.fill && cell.s.fill.fgColor));
        cells.push({text:v, color: fg && fg.rgb ? fg.rgb : ''});
      }
      if (whoMatch(rowText, who)) return {ym: findYm(headText), cells};
    }
  }
  return {error:'ไม่พบชื่อหรือรหัส “' + who + '” ในไฟล์'};
}
function rosterPreview(out, clean, notes){
  Roster.setResult(clean);
  out.innerHTML = `<p style="margin:0 0 6px"><strong>อ่านได้ ${clean.length} วัน</strong> ติ๊กออกวันที่ไม่ถูกต้อง แล้วกดลงเวร</p>
    ${notes ? `<p class="meta" style="margin:0 0 6px">${esc(notes)}</p>` : ''}
    <div class="preview">${clean.map((c, i) => { const old = shiftsOn(c.date); const same = old.slice().sort().join('+') === c.types.slice().sort().join('+'); return `<label><input type="checkbox" data-i="${i}"${same ? '' : ' checked'} style="width:20px;height:20px;margin:0"><span style="width:96px">${esc(thDate(c.date,{weekday:'short',day:'numeric',month:'short'}))}</span><span class="grow">${c.types.map(k => esc(typeLabel(k))).join(' + ')}${old.length ? `<span class="meta">${same ? 'ตรงกับที่ลงไว้แล้ว' : 'เดิม: ' + old.map(k => esc(typeLabel(k))).join(' + ')}</span>` : ''}</span></label>`; }).join('')}</div>
    <button type="button" class="btn primary" data-act="roster-apply" style="margin-top:10px;width:100%">ลงเวรที่เลือก</button>`;
}
async function readRosterFile(f){
  const fd = new FormData(f);
  const file = fd.get('file'); const who = String(fd.get('who') || '').trim(); const ymSel = String(fd.get('ym') || '');
  if (!file || !file.size || !who) return;
  S.settings.rosterName = who; writeLocal();
  const out = f.querySelector('#rf-out');
  out.innerHTML = '<p class="meta">กำลังอ่านไฟล์…</p>';
  try{
    let res;
    if (/\.xlsx?$/i.test(file.name)) res = await parseRosterXlsx(await file.arrayBuffer(), who);
    else res = parseRosterHtml(await file.text(), who);
    if (res.error){ out.innerHTML = `<div class="banner appt" style="margin:0"><div>${esc(res.error)} ลองพิมพ์รหัสพนักงานอย่างเดียว</div></div>`; return; }
    const ym = res.ym || ymSel;
    const {list, skipped} = cellsToShifts(res.cells, ym);
    if (!list.length){ out.innerHTML = '<div class="banner appt" style="margin:0"><div>พบแถวของคุณ แต่อ่านรหัสเวรไม่ออก ใช้แท็บ “ลงทั้งเดือน” แทนได้</div></div>'; return; }
    rosterPreview(out, list, `ไฟล์เดือน ${parse(ym + '-01').toLocaleDateString('th-TH',{month:'long', year:'numeric'})}${res.ym ? '' : ' (ใช้เดือนที่เลือก)'} · ช่องเหลืองที่เขียน 8-16 อ่านเป็น 8-16 + STD${skipped ? ' · ข้าม ' + skipped + ' วันที่อ่านไม่ออก' : ''}`);
  }catch(e){ out.innerHTML = '<div class="banner appt" style="margin:0"><div>อ่านไฟล์นี้ไม่ได้ ใช้ไฟล์ .html หรือ .xlsx ที่แผนกส่งมา</div></div>'; }
}


/* ---------- เด้งเตือนจริงบนมือถือ: ส่งนัดไป Google Calendar พร้อมการแจ้งเตือน (popup) ---------- */
const Push = (function(){
  let mcp = null, tried = false, last = '';
  const err = code => ({
    server_not_connected:'บัญชี Claude ยังไม่ได้เชื่อม Google Calendar (claude.ai › ตั้งค่า › Connectors)',

    not_granted:'ยังไม่ได้อนุญาตให้แอปเพิ่มนัดลง Google Calendar กดทดสอบแล้วกดอนุญาต',
    approval_required:'ต้องอนุญาตก่อน กดทดสอบแล้วกดอนุญาต',

    blocked_by_policy:'องค์กรของบัญชีนี้ปิดการใช้ Google Calendar'

    if (mcp) return mcp;
    try{ mcp = window.claude && window.claude.use ? await window.claude.use('mcp') : null; }catch(e){ mcp = null; }
    return mcp;
  }
  function plan(a){
    const st = a.time || '09:00';
    const mins = [];
    const r = a.remind || {};
    if (r.d1) mins.push(1440);
    if (r.morning) mins.push(Math.max(0, toMin(st) - 7 * 60));
    if (r.h2 && a.time) mins.push(120);
    const endM = toMin(st) + 60;
    const endDate = endM >= 1440 ? addDays(a.date, 1) : a.date;
    return {startTime: `${a.date}T${st}:00`, endTime: `${endDate}T${fromMin(endM)}:00`, mins:[...new Set(mins)].slice(0,5)};
  }
  async function remove(a){

    delete a.gcalId; return true;
  }
  async function sync(a, quiet){

    if (!pl.mins.length){ a.pushErr = 'นัดนี้ไม่ได้ตั้งเตือน'; writeLocal(); return false; }
    try{
      if (a.gcalId) await remove(a);

        description: ['จากแอปเลขาส่วนตัว', a.place ? 'สถานที่: ' + a.place : '', a.who ? 'ติดตาม: ' + a.who : '', a.time ? '' : '(ไม่ได้ระบุเวลา ตั้งไว้ 09:00)'].filter(Boolean).join('\n'),
        location: a.place || undefined, useDefaultReminders:false,
        overrideReminders: pl.mins.map(n => ({method:'popup', minutes:n})), notificationLevel:'NONE'
      });
      const p = res && res.payload ? res.payload : {};
      const id = p.id || (p.event && p.event.id) || (p.createdEvent && p.createdEvent.id) || '';
      if (id) a.gcalId = id; else a.gcalSent = true;
      delete a.pushErr; last = 'ส่งล่าสุด ' + nowHM();
      log('ส่งเตือนไป Google Calendar: ' + a.title, true); writeLocal();
      if (!quiet) toast('ตั้งเด้งเตือนแล้ว (Google Calendar ยืนยัน)');
      render(); return true;
    }catch(e){
      a.pushErr = err(e && e.code); last = a.pushErr;
      log('ส่งเตือนไป Google Calendar: ' + a.title, false); writeLocal();
      if (!quiet) toast(a.pushErr, true);
      render(); return false;
    }
  }
  return {
    sync, remove,
    async syncAll(){
      const list = S.appts.filter(a => !a.done && a.date >= today() && !a.gcalId && !a.gcalSent);
      if (!list.length){ toast('ทุกนัดที่จะถึงส่งไปแล้ว'); return; }
      let ok = 0; for (const a of list){ if (await sync(a, true)) ok++; }
      toast(ok === list.length ? 'ตั้งเด้งเตือนครบ ' + ok + ' นัด' : 'สำเร็จ ' + ok + '/' + list.length + ' นัด · ' + last, ok !== list.length);
    },
    async test(){
      const pm = window.claude && window.claude.use ? await window.claude.use('permissions').catch(() => null) : null;

      catch(e){ last = err(e && e.code); }
      render();
    },
    status(){ return S.settings.push ? (last || 'เปิดอยู่ นัดใหม่จะถูกส่งไป Google Calendar พร้อมเด้งเตือน') : 'ปิดอยู่ เตือนในแอปที่หน้า My day เท่านั้น'; },
    claudeText(){

        const pl = plan(a); const w = [];

      }).join('\n');
    }
  };
})();

async function uploadLogo(file){
  try{
    const url = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
    const img = await new Promise((res, rej) => { const im = new Image(); im.onload = () => res(im); im.onerror = rej; im.src = url; });
    const sc = Math.min(1, 480 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    localStorage.setItem(LS_LOGO, c.toDataURL('image/png'));
    log('เปลี่ยนโลโก้ฟอร์ม', true); writeLocal(); render(); toast('ใส่โลโก้แล้ว');
  }catch(e){ toast('ใช้รูปนี้ไม่ได้', true); }
}

function monthsInScope(scope){
  const t = today().slice(0,7);
  if (scope === 'month') return [tsMonth];
  if (scope === 'year'){ const y = tsMonth.slice(0,4); return Array.from({length:12}, (_, i) => `${y}-${pad(i + 1)}`); }
  const set = new Set([t]);
  [S.shifts, S.cases, S.extra].forEach(o => Object.keys(o || {}).forEach(d => set.add(d.slice(0,7))));
  S.appts.forEach(a => set.add(a.date.slice(0,7)));

}
function monthSummary(ym){
  const H = hoursFor(ym); const P = payFor(ym);

/* ---------- ไฟล์ปฏิทิน .ics (เวอร์ชัน GitHub): นำเข้าปฏิทินมือถือแล้วเด้งเตือนจริง ---------- */
async function exportIcs(){
  const list = S.appts.filter(a => !a.done && a.date >= today());
  if (!list.length){ toast('ยังไม่มีนัดที่จะถึง', true); return; }
  const esc2 = t => String(t || '').replace(/\\/g, '\\\\').replace(/[,;]/g, m => '\\' + m).replace(/\n/g, '\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const L = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//secretary-app//TH','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  list.forEach(a => {
    const st = a.time || '09:00'; const sm = toMin(st); const em = sm + 60;
    const d0 = a.date.replace(/-/g, ''); const d1 = (em >= 1440 ? addDays(a.date, 1) : a.date).replace(/-/g, '');
    L.push('BEGIN:VEVENT', 'UID:' + a.id + '@secretary-app', 'DTSTAMP:' + stamp, 'DTSTART:' + d0 + 'T' + st.replace(':', '') + '00', 'DTEND:' + d1 + 'T' + fromMin(em).replace(':', '') + '00', 'SUMMARY:' + esc2(a.title));
    if (a.place || a.who) L.push('LOCATION:' + esc2(a.place || a.who));
    const r = a.remind || {}; const mins = [];
    if (r.d1) mins.push(1440); if (r.morning) mins.push(Math.max(0, sm - 420)); if (r.h2 && a.time) mins.push(120);
    [...new Set(mins)].forEach(m => L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + esc2(a.title), 'TRIGGER:-PT' + m + 'M', 'END:VALARM'));
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  const dl = await window.claude.use('downloads');
  try{ await dl.save({filename:'secretary-reminders.ics', data:L.join('\r\n'), mimeType:'text/calendar'}); log('ดาวน์โหลดไฟล์ปฏิทิน ' + list.length + ' นัด', true); writeLocal(); toast('ดาวน์โหลดแล้ว เปิดไฟล์เพื่อเพิ่มลงปฏิทินมือถือ'); }
  catch(e){ toast('ดาวน์โหลดไม่สำเร็จ', true); }
}

const Updater = {
  latest: '', checking: false, msg: '',
  async check(manual){

/* ---------- แจ้งเตือนจริงแม้ปิดแอป (Web Push ผ่านเซิร์ฟเวอร์ Cloudflare ของคุณเอง) ---------- */
const LS_WPUSH = 'tmm-push-v1';
const WPush = {
  status: '', timer: null,
  cfg(){ try{ return JSON.parse(localStorage.getItem(LS_WPUSH) || '{}'); }catch(e){ return {}; } },
  save(c){ try{ localStorage.setItem(LS_WPUSH, JSON.stringify(c)); }catch(e){} },
  supported(){ return STANDALONE && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window; },
  items(){
    const out = []; const now = Date.now(); const lim = now + 60 * 86400e3;
    const at = (d, hm) => { const [y,m,dd] = d.split('-').map(Number); const [h,mi] = (hm || '09:00').split(':').map(Number); return new Date(y, m-1, dd, h, mi).getTime(); };
    S.appts.filter(a => !a.done && a.date >= addDays(today(), -1)).forEach(a => {
      const r = a.remind || {}; const tm = a.time || '09:00';
      const where = [a.time ? a.time + ' น.' : '', a.place || a.who || ''].filter(Boolean).join(' · ');
      if (r.d1) out.push({id: a.id + ':d1', at: at(addDays(a.date, -1), tm), title: '⏰ พรุ่งนี้: ' + a.title, body: where || 'นัดพรุ่งนี้'});
      if (r.morning) out.push({id: a.id + ':am', at: at(a.date, '07:00'), title: '☀️ วันนี้: ' + a.title, body: where || 'นัดวันนี้'});
      if (r.h2 && a.time) out.push({id: a.id + ':h2', at: at(a.date, tm) - 2 * 3600e3, title: '🔔 อีก 2 ชม.: ' + a.title, body: where});
    });
    return out.filter(i => i.at > now - 60e3 && i.at < lim).map(i => Object.assign(i, {id: i.id + '@' + i.at}));
  },
  async writeCfg(c){ try{ const cache = await caches.open('tmm-cfg'); await cache.put('/tmm-cfg', new Response(JSON.stringify({url:c.url, dev:c.dev, key:c.key}), {headers:{'Content-Type':'application/json'}})); }catch(e){} },
  b64ToBytes(s){ const p = '='.repeat((4 - s.length % 4) % 4); const b = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from(b, ch => ch.charCodeAt(0)); },
  async connect(url, key){
    url = String(url || '').trim().replace(/\/+$/, '');
    if (!/^https:\/\/[^/]+/.test(url)){ toast('ใส่ลิงก์เซิร์ฟเวอร์ที่ขึ้นต้นด้วย https://', true); return; }
    if (!this.supported()){ toast('ต้องเปิดจากแอปที่ติดตั้งจาก GitHub ใน Chrome', true); return; }
    this.status = 'กำลังเชื่อมต่อ…'; render();
    try{
      const perm = await Notification.requestPermission();
      if (perm !== 'granted') throw new Error('ยังไม่ได้อนุญาตการแจ้งเตือน');
      const r0 = await fetch(url + '/vapid', {cache:'no-store'}); const v = await r0.json();
      if (!v.publicKey) throw new Error(v.error || 'เซิร์ฟเวอร์ยังไม่พร้อม');
      const reg = await navigator.serviceWorker.ready;
      const old = await reg.pushManager.getSubscription(); if (old) await old.unsubscribe().catch(() => {});
      const sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:this.b64ToBytes(v.publicKey)});
      const c = this.cfg(); c.url = url; c.on = true;
      c.dev = c.dev || ('d' + uid() + uid());
      c.key = String(key || '').trim() || c.key || Array.from(crypto.getRandomValues(new Uint8Array(16)), b => b.toString(16).padStart(2, '0')).join('');
      this.save(c); await this.writeCfg(c);
      S.settings.noti = true; writeLocal();
      const ok = await this.sync(sub);
      if (ok){ toast('เชื่อมต่อแล้ว กด “ทดสอบเด้ง” ได้เลย'); log('เชื่อมแจ้งเตือนจริง (Push)', true); writeLocal(); }
    }catch(e){ this.status = 'เชื่อมไม่สำเร็จ: ' + (e.message || e); toast(this.status, true); }
    render();
  },
  async sync(subIn){
    const c = this.cfg(); if (!c.on || !c.url || !this.supported()) return false;
    try{
      const reg = await navigator.serviceWorker.ready;
      const sub = subIn || await reg.pushManager.getSubscription();
      if (!sub){ this.status = 'การสมัครรับแจ้งเตือนหายไป กดเชื่อมต่อใหม่'; return false; }
      const items = this.items();
      const r = await fetch(c.url + '/sync', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({key:c.key, dev:c.dev, sub: sub.toJSON(), items})});

function peopleFromCells(rows, ym){
  const people = [];
  rows.forEach(cells => {
    const idIdx = cells.findIndex(c => /^\d{5,7}$/.test(c.text));
    if (idIdx < 0 || !cells[idIdx + 1] || !cells[idIdx + 1].text || codeToTypes(cells[idIdx + 1].text, '')) return;
    const {list} = cellsToShifts(cells.slice(idIdx + 2), ym);
    if (list.length) people.push({empId: cells[idIdx].text, name: cells[idIdx + 1].text, list});

}
/* PDF ที่มีข้อความ: อ่านรหัสเวรจากข้อความ และอ่านสีช่องจากภาพของหน้า */
async function peopleFromPdf(buf, ymSel){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({data:new Uint8Array(buf), isEvalSupported:false}).promise;
  let people = [], ym = null, firstCanvas = null, allText = '';
  for (let pn = 1; pn <= Math.min(doc.numPages, 4); pn++){
    const page = await doc.getPage(pn);
    const vp = page.getViewport({scale:2});
    const cv = document.createElement('canvas'); cv.width = Math.ceil(vp.width); cv.height = Math.ceil(vp.height);
    const ctx = cv.getContext('2d', {willReadFrequently:true});
    await page.render({canvasContext:ctx, viewport:vp}).promise;
    if (!firstCanvas) firstCanvas = cv;
    const tc = await page.getTextContent();
    const items = tc.items.filter(it => it.str && it.str.trim()).map(it => {
      const [x, yb] = vp.convertToViewportPoint(it.transform[4], it.transform[5]);
      const h = Math.abs(it.transform[3]) * 2 || 16, w = (it.width || 0) * 2;
      return {t: it.str.trim(), x, y: yb - h / 2, w, h};
    });
    allText += ' ' + items.map(i => i.t).join(' ');
    ym = ym || findYm(allText) || ymSel;
    const [yy,mm] = ym.split('-').map(Number); const nd = new Date(yy, mm, 0).getDate();
    /* หัวตาราง: แถวที่มีตัวเลข 1..31 มากที่สุด */
    const nums = items.filter(i => /^\d{1,2}$/.test(i.t) && +i.t >= 1 && +i.t <= 31);
    const groups = [];
    nums.forEach(i => { const g = groups.find(g => Math.abs(g.y - i.y) < 6); if (g) g.list.push(i); else groups.push({y:i.y, list:[i]}); });
    const head = groups.map(g => ({y:g.y, map:new Map(g.list.map(i => [+i.t, i.x + i.w / 2]))})).sort((a, b) => b.map.size - a.map.size)[0];
    if (!head || head.map.size < Math.min(25, nd - 3)) continue;
    const xs = [...head.map.keys()].sort((a, b) => a - b);
    const colW = (head.map.get(xs[xs.length - 1]) - head.map.get(xs[0])) / Math.max(1, xs[xs.length - 1] - xs[0]);
    const dayX = d => head.map.has(d) ? head.map.get(d) : head.map.get(xs[0]) + (d - xs[0]) * colW;
    const firstX = dayX(1) - colW / 2;
    const dayList = [...head.map.entries()].sort((a, b) => a[0] - b[0]);
    const nearestDay = x => { let best = null, bd = 1e9; dayList.forEach(([d, hx]) => { const dd = Math.abs(hx - x); if (dd < bd){ bd = dd; best = d; } }); return bd < colW * 0.75 ? best : null; };
    const ids = items.filter(i => /^\d{5,7}$/.test(i.t) && i.y > head.y + 4).sort((a, b) => a.y - b.y);
    const gaps = ids.slice(1).map((i, k) => i.y - ids[k].y).filter(v => v > 4);
    const rowH = gaps.length ? Math.min(...gaps) : 40;
    const rowOf = it => { let best = null, bd = 1e9; ids.forEach(id => { const dd = Math.abs(id.y - it.y); if (dd < bd){ bd = dd; best = id; } }); return bd < Math.max(rowH * 0.8, 16) ? best : null; };
    const PUA = {'\uf705':'่','\uf706':'้','\uf707':'๊','\uf708':'๋','\uf709':'์','\uf70a':'่','\uf70b':'้','\uf70c':'๊','\uf70d':'๋','\uf70e':'์','\uf710':'ั','\uf711':'ิ','\uf712':'ี','\uf713':'ึ','\uf714':'ื','\uf715':'ํ','\uf716':'็'};
    const fixTh = t => t.replace(/[\uf700-\uf8ff]/g, ch => PUA[ch] || '');
    ids.forEach(idI => {
      const row = items.filter(i => i !== idI && rowOf(i) === idI);
      const nameParts = row.filter(i => i.x + i.w <= firstX + 2 && i.x >= idI.x + idI.w - 2 && !/^\d+$/.test(i.t)).sort((a, b) => a.x - b.x);
      let name = ''; nameParts.forEach((it, k) => { const prev = nameParts[k - 1]; name += (prev && it.x - (prev.x + prev.w) > 3 ? ' ' : '') + fixTh(it.t); });
      name = name.replace(/\s+/g, ' ').trim();
      /* ข้อความในแถวอาจติดกันหลายช่อง เช่น "8-00STD8-16" → แยกเป็นทีละรหัส แล้ววางตามตำแหน่ง */
      const byDay = {};
      row.filter(i => i.x + i.w > firstX).forEach(it => {
        const raw = it.t; const re = /8-16|8-00|8-8|STD|OFF|X/gi; let m, prev = 0;
        while ((m = re.exec(raw))){
          const mid = it.x + it.w * ((m.index + m[0].length / 2) / raw.length);
          let d = nearestDay(mid); if (!d) continue;
          if (prev && d <= prev) d = prev + 1;   /* รหัสที่ติดกันในข้อความเดียว = คนละวันเรียงกัน */
          prev = d;
          if (!byDay[d]) byDay[d] = {code: m[0].toUpperCase(), y: it.y};
        }
      });
      const list = [];
      Object.keys(byDay).map(Number).sort((a, b) => a - b).forEach(d => {
        if (d > nd) return;
        const cx = dayX(d); const lw = d > 1 && head.map.has(d - 1) ? Math.min(colW * 2, cx - dayX(d - 1)) : colW; const sx = Math.round(cx - lw * 0.42), sy = Math.round(byDay[d].y);
        /* อ่านสีพื้นช่องจากหลายจุด (ข้อความอาจทับจุดเดียว) แล้วเลือกสีที่เจอมากที่สุด */
        const pts = [[cx, sy - rowH * 0.3], [cx, sy + rowH * 0.3], [sx, sy], [cx + lw * 0.42, sy], [sx, sy - rowH * 0.25], [cx + lw * 0.42, sy + rowH * 0.25]];
        const cnt = {};
        pts.forEach(([px0, py0]) => { const x0 = Math.round(px0), y0 = Math.round(py0); if (x0 < 0 || y0 < 0 || x0 >= cv.width || y0 >= cv.height) return; const px = ctx.getImageData(x0, y0, 1, 1).data; const k = colorKind('#' + [px[0], px[1], px[2]].map(n => n.toString(16).padStart(2, '0')).join('')); cnt[k] = (cnt[k] || 0) + 1; });
        const best = ['yellow','blue','red'].filter(k => cnt[k]).sort((p1, p2) => cnt[p2] - cnt[p1])[0] || (cnt.white ? 'white' : '');
        const color = {yellow:'#ffff00', blue:'#2e75b6', red:'#ff0000', white:'#ffffff'}[best] || '';
        const ts = codeToTypes(byDay[d].code, color);
        if (ts) list.push({date:`${ym}-${pad(d)}`, types:ts});
      });
      if (list.length) people.push({empId:idI.t, name, list});
    });
    if (people.length) break;
  }
  return {ym: ym || ymSel, people, canvas:firstCanvas};
}
